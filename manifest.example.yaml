# ai-agent-kit manifest example
# Copy to <project-slug>.yaml in your target project, edit fields, then either:
#   - have an AI agent follow docs/prompts/setup.md to install (no scripts), or
#   - keep this manifest as the canonical config the kit's /kit-update command reads.

# ─────────────────────────────────────────────
# KIT VERSION (do not change manually — set by setup.md / /kit-update)
# ─────────────────────────────────────────────
kit_version: "5.2.0"

# ─────────────────────────────────────────────
# LANGUAGE
# ─────────────────────────────────────────────
# Agent output language. Sets the install-time default for the locale env var
# (OPENCODE_LANG for the opencode host, KIT_LANG for the claude-code host).
# Supported: en (English), ru (Russian). Default: en
language_code: en

# ─────────────────────────────────────────────
# AUTO-APPROVE (v5.0+; granular form added in v5.1)
# ─────────────────────────────────────────────
# Two forms:
#
#   (A) boolean — same setting for every task class:
#         auto_approve: false   # always confirm (default)
#         auto_approve: true    # auto-approve every class
#
#   (B) object (granular) — per-class control. Missing keys default to false.
#         auto_approve:
#           feature: false      # FEATURE pipeline CONFIRM
#           tech: false         # TECH pipeline CONFIRM
#           techdebt: true      # /kit-techdebt batches
#           bug:
#             low: true
#             medium: true
#             high: false       # always confirm HIGH bugs
#             critical: false   # always confirm CRITICAL bugs
#
# Other gates (DEPLOY, DESTROY, SECRET_ROTATE, MIGRATION, EXTERNAL_API) always
# require explicit /kit-approve — auto_approve does not affect them.
auto_approve: false

# ─────────────────────────────────────────────
# HOSTS (1..N — projects can run on OpenCode, Claude Code, or both)
# ─────────────────────────────────────────────
# Each host name renders its own template tree into the target:
#   opencode    → .opencode/ + opencode.json + AGENTS.md
#   claude-code → .claude/   + .claude/settings.json + CLAUDE.md
# Multi-host installs render both side-by-side; subagents in .opencode/agents/
# and .claude/agents/ share their bodies via the kit's _shared/ tree.
hosts: [opencode]

# ─────────────────────────────────────────────
# PROJECT
# ─────────────────────────────────────────────
project:
  name: "My Project"
  description: "Brief one-line description of the project"

# ─────────────────────────────────────────────
# KNOWLEDGE VAULT
# ─────────────────────────────────────────────
# Path (relative to project root) where KnowledgeOS stores all agent-generated docs.
# Default: vault/. v5 uses a flat layout: features/<module>/<feature>/feature.md +
# test-cases.md per feature, plus shared guidelines/ and tech-debt/ subtrees.
vault_path: vault

# ─────────────────────────────────────────────
# STACK
# ─────────────────────────────────────────────
# Profiles are picked along five orthogonal axes (see README → "Available profiles"):
#   language    (exactly 1):  kotlin-gradle | make-generic
#   framework   (0..N):       compose-multiplatform | paper-plugin
#   host        (1..N):       opencode | claude-code     ← matches the `hosts:` list above
#   provider    (1 if opencode in hosts, else 0): routerai | ollama-cloud
#   capability  (0..N):       security-baseline (always-on) | solid | clean-architecture
#                              | requirements-pipeline (no-op in v5+) | quality-gates
stack:
  language: kotlin
  profiles:
    - kotlin-gradle           # language
    - compose-multiplatform   # framework
    - opencode                # host
    - routerai                # provider (only because opencode is a host)
    - security-baseline       # capability (auto-added if missing)
    - solid                   # capability (SOLID + class-level OO design)
    - clean-architecture      # capability (system-level layering / ports & adapters / boundary DTOs)
    - quality-gates           # capability (opt-in test-quality + traceability forbidden patterns)
    # - requirements-pipeline # capability (legacy, no-op in v5+ — Analyst is always on)

  # external_profiles is populated automatically by /kit-extend when you add a
  # profile fetched from a URL outside this kit's repo.
  # external_profiles:
  #   my-team-style: https://github.com/my-org/my-kit-extras/blob/master/profiles/capability/my-team-style.yaml

  build_command: "./gradlew"
  compile_command: "./gradlew compileKotlin"
  lint_command: "./gradlew detekt ktlintCheck"
  test_command: "./gradlew :[module]:test"   # [module] is a literal placeholder

# ─────────────────────────────────────────────
# MODULES
# ─────────────────────────────────────────────
modules:
  - name: server
    gradle_module: ":server"
    source_root: "server/src/main/kotlin/com/example/"
    test_root: "server/src/test/kotlin/com/example/"
    docs_path: "vault/server/"
    responsibility: "Ktor server, business logic, auth"

  - name: client
    gradle_module: ":composeApp"
    source_root: "composeApp/src/commonMain/kotlin/com/example/"
    test_root: "composeApp/src/commonTest/kotlin/com/example/"
    docs_path: "vault/client/"
    responsibility: "Compose Multiplatform UI, session management"

# ─────────────────────────────────────────────
# PROVIDER (OpenCode only — required iff opencode ∈ hosts; env var NAME, never the actual key)
# ─────────────────────────────────────────────
provider:
  name: routerai
  base_url: https://routerai.ru/api/v1
  api_key_env: ROUTERAI_OPENCODE

# ─────────────────────────────────────────────
# MODELS (OpenCode only — required iff opencode ∈ hosts)
# ─────────────────────────────────────────────
models:
  default: moonshotai/kimi-k2.6
  coder: qwen/qwen3-coder-next
  reviewer: deepseek/deepseek-v4-pro
  designer: openai/gpt-5.4         # set to null to omit @Designer agent
  small: qwen/qwen3-coder-next

# ─────────────────────────────────────────────
# CLAUDE_CODE (required iff claude-code ∈ hosts; omit otherwise)
# ─────────────────────────────────────────────
# Models accept the Claude Code CLI aliases (opus, sonnet, haiku) which resolve
# to the latest model in each tier, or full IDs (claude-opus-4-7, claude-sonnet-4-6,
# claude-haiku-4-5).
# claude_code:
#   models:
#     default: sonnet      # orchestrator (main session role)
#     coder: opus
#     reviewer: opus
#     designer: opus       # set to null to omit @Designer agent
#     small: haiku

# ─────────────────────────────────────────────
# MCP INTEGRATIONS
# ─────────────────────────────────────────────
mcp:
  context7:
    enabled: true
    api_key_env: CONTEXT7_API_KEY

  knowledge:
    enabled: true
    url: http://localhost:8085/mcp

  serena:
    enabled: true                    # set false for non-JVM projects

# ─────────────────────────────────────────────
# LSP
# ─────────────────────────────────────────────
lsp:
  enabled: true
  command: kotlin-lsp
  extensions: [".kt", ".kts"]

# ─────────────────────────────────────────────
# UI / DESIGNER
# ─────────────────────────────────────────────
ui:
  framework: "Compose Multiplatform"   # null → omit @Designer agent
  platforms: ["Desktop", "Android", "iOS"]
  colors:
    - name: "Brand Primary"
      hex: "#2A6FF1"
      purpose: "Primary accent / CTA"
    - name: "Background"
      hex: "#FFFFFF"
      purpose: "Page background"
    - name: "Text Primary"
      hex: "#0F172A"
      purpose: "Body text"

# ─────────────────────────────────────────────
# CODE QUALITY (forbidden patterns surfaced in AGENTS.md and @CodeWriter)
# ─────────────────────────────────────────────
code_quality:
  forbidden_patterns:
    - "!! operator (use requireNotNull/checkNotNull with message)"
    - "GlobalScope.launch (always use a scoped coroutine)"
    - "Thread.sleep in suspend code (use delay())"
    - "Empty catch blocks"
    - "Bare Exception/Throwable catch (catch specific types)"
    - "TODO() in production code without a DECISIONS.md entry"
    - "Raw SQL string concatenation with user input (use parameterized queries)"

# ─────────────────────────────────────────────
# FORMATTER (auto-fix on save)
# ─────────────────────────────────────────────
formatter:
  enabled: true
  name: "gradle-detekt-format"
  command: ["./gradlew", "detekt", "--auto-correct"]
  extensions: [".kt", ".kts"]
