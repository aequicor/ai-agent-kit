# ai-agent-kit manifest example
# Copy to <project-slug>.yaml in your target project, edit fields, then either:
#   - have an AI agent follow docs/prompts/setup.md to install (no scripts), or
#   - keep this manifest as the canonical config the kit's /kit-update command reads.

# ─────────────────────────────────────────────
# KIT VERSION (do not change manually — set by setup.md / /kit-update)
# ─────────────────────────────────────────────
kit_version: "7.0.0"

# ─────────────────────────────────────────────
# LANGUAGE
# ─────────────────────────────────────────────
# Agent output language. Sets the install-time default for the locale env var
# (OPENCODE_LANG for the opencode host, KIT_LANG for the claude-code host).
# Supported: en (English), ru (Russian). Default: en
language_code: en

# ─────────────────────────────────────────────
# AUTO-APPROVE (v5.0+; granular form added in v5.1)
# ─────────────────────────────────────────────
# Two forms:
#
#   (A) boolean — same setting for every task class:
#         auto_approve: false   # always confirm (default)
#         auto_approve: true    # auto-approve every class
#
#   (B) object (granular) — per-class control. Missing keys default to false.
#         auto_approve:
#           feature: false      # FEATURE pipeline CONFIRM
#           tech: false         # TECH pipeline CONFIRM
#           techdebt: true      # /kit-techdebt batches
#           bug:
#             low: true
#             medium: true
#             high: false       # always confirm HIGH bugs
#             critical: false   # always confirm CRITICAL bugs
#
# Other gates (DEPLOY, DESTROY, SECRET_ROTATE, MIGRATION, EXTERNAL_API) always
# require explicit /kit-approve — auto_approve does not affect them.
#
# v6.0+ also adds `auto_approve.diff_review` (object form only) for the
# mandatory PO-eye gate at step 5.10. Default false even when feature/tech/bug
# are all true. Setting it true bypasses the only PO-eye step v6 introduces —
# do not enable lightly.
auto_approve: false

# ─────────────────────────────────────────────
# SLICE CAPS (v6.0+ — P1; v6.2+ adds max_tokens_per_step — P17)
# ─────────────────────────────────────────────
# Hard caps enforced by @Main at PLAN/CONFIRM and by @CodeWriter at every step.
# Overflow → BLOCKED (no auto-trim). Set any field to 0 to disable that cap.
#
# v6.2+ rationale for max_tokens_per_step: Anthropic context-engineering guidance
# ("smallest set of high-signal tokens") + 2024–2026 research showing LLM-as-
# reviewer accuracy degrades with prompt complexity. Cap is enforced at 5.1
# EXTRACT (where STEP_CONTEXT is built); @Main attempts to trim optional sub-
# bundles (REPO_MAP excerpt → unrelated tcs rows → distant How-it-works
# subsections), then BLOCKED with reason OVERFLOW_TOKENS if still over.
slice_caps:
  max_steps: 6                    # max steps in plan.md § Implementation plan
  max_files_per_step: 5           # max files (Create+Modify+Delete) per @CodeWriter step
  max_lines_per_step: 400         # max +lines + -lines per step
  max_tokens_per_step: 30000      # v6.2+ — STEP_CONTEXT bundle cap (bytes/4 estimate)

# ─────────────────────────────────────────────
# AGENT ROSTER (v7.0.0+ — fixed, 5 agents total)
# ─────────────────────────────────────────────
# v7.0.0 finalized the 9 → 5 consolidation:
#   @Main        — orchestrator (main session in Claude Code; subagent in OpenCode)
#   @Architect   — spec.md + plan.md skeleton + UI section. Replaces v6.x Analyst+Designer.
#   @CodeWriter  — code + tests + 5-section runbook. Unchanged.
#   @Verifier    — mode-driven verification (10 modes). Replaces v6.x TestKeeper+Reviewer+DoDGate+TraceabilityChecker.
#   @BugFixer    — debug + fix + retro. Unchanged.
#
# No flags. v7.0.0-beta's `agents.{consolidated_architect, consolidated_verifier}`
# opt-in toggles are removed; consolidated dispatch is the only path.

# ─────────────────────────────────────────────
# LANES (v7.0.0+ — P21, MANDATORY)
# ─────────────────────────────────────────────
# Risk-based pipeline triage. @Main classifies every task at Step 0a as
# trivial | standard | critical and routes through a different pipeline
# density:
#
#   trivial   — ≤1 file, ≤30 lines, no new public symbols. Short pipeline:
#               @CodeWriter → @Verifier MODE=REVIEW (Pass A only) →
#               ground-truth → commit. No @Architect, no DoD, no Trace,
#               no 5.10 diff-review. Saves ~70% tokens for tiny tasks.
#   standard  — full pipeline.
#   critical  — standard + adversarial 2nd pass on every step + mutation-
#               sample backend artefact (≥3 mutants killed) + sleep mode
#               forbidden + diff-review never auto-approved.
#
# v7.0.0 made lanes mandatory; the v7.0.0-alpha `lanes.enabled: false`
# opt-out is removed. PO can override @Main's auto-classification by passing
# --risk explicitly:
#   /kit-new-feature --risk=trivial "rename label on Save button to Submit"
#   /kit-new-feature --risk=critical "rotate auth tokens in OAuth flow"
lanes:
  default_risk: standard                  # fallback when auto-classify uncertain
  trivial_max_files: 1                    # overflow → auto-reclassify to standard
  trivial_max_lines: 30
  trivial_no_new_public_symbols: true     # trivial lane forbids new public APIs
  critical_block_sleep: true              # refuse /kit-sleep for critical tasks
  critical_require_mutation_sample: true  # ≥3 mutants killed for critical backend
  auto_classify: true                     # let @Main infer risk from heuristics

# ─────────────────────────────────────────────
# TELEMETRY (v6.3+ — P20)
# ─────────────────────────────────────────────
# Gate-signal-ratio telemetry. Each gate verdict (slice-cap, runnable-slice,
# token-budget, build, review-*, runbook-complete, ground-truth, reconcile,
# traceability, dod, diff-review) is appended to evals/runs/<kit_version>/gates.csv
# via the gate-telemetry skill. Together with defects.csv (P19, v6.2+) gives
# the kit a self-cleaning gate-evaluation mechanism: gates with rolling
# signal_ratio < threshold AND no defect_origin matches are flagged as
# deprecation candidates by /kit-status.
#
# Opt-in by directory presence: if evals/runs/<kit_version>/ does not exist,
# all logging is a no-op (no error, no warning).
telemetry:
  gates_log_enabled: true        # master switch; set false to suppress all gate-csv writes
  evaluation_window_tasks: 30    # rolling window size for /kit-status aggregation
  signal_ratio_threshold: 0.05   # gates below this AND no false_negatives → 🟡 deprecation_candidate

# ─────────────────────────────────────────────
# GROUND TRUTH (v6.2+ — P18)
# ─────────────────────────────────────────────
# Mandatory non-AI verification artefact at 5.6 CHECKPOINT before /kit-approve.
# Backed by Anthropic harness guidance + 2024–2026 research on AI-on-AI
# verification accuracy ceiling (~68% for code review, ~25% false-negatives).
# One artefact per step closes the gap on the class of defect that AI checkers
# share blind spots on (UI broken despite green tests, API contract mismatch,
# backend logic missing edge cases under mutation).
#
# Per-step PO attaches one of:
#   ui       → screenshot or preview-snapshot
#   api      → contract-test pass with real payload
#   cli      → command-output diff before/after
#   backend  → mutation-sample (≥1 mutant killed; ≥3 for Critical-EC steps)
#   refactor → diff-stat + smoke test (no user-visible change)
#
# Override per-step: /kit-approve --no-ground-truth (logged as technical debt
# in test-cases.md Defects log). Override project-wide: required: false (logged
# once per task in step_commits[1].notes).
ground_truth:
  required: true             # set false project-wide for spike/exploration repos
  exclusions:
    modules: []              # list module names where the gate is skipped
  default_types:
    ui: screenshot
    api: contract-test-pass
    cli: command-output-diff
    backend: mutation-sample-pass
    refactor: diff-stat-and-smoke

# ─────────────────────────────────────────────
# TEST STRATEGY (v6.0+ — P8)
# ─────────────────────────────────────────────
# tdd_first   — failing tests before production code (v5 default; v6 default)
# test_after  — production code first, then tests against actual behaviour;
#               @Reviewer Pass A4 enforces assertion quality
# mixed       — tdd_first for AC-bound steps, test_after for [exploratory]
#               sub-tasks; CodeWriter picks per sub-task
test_strategy: tdd_first
# Object form (granular):
# test_strategy:
#   default: tdd_first
#   allow_per_step_override: false   # if true, plan.md steps may set Test strategy: <mode>

# ─────────────────────────────────────────────
# SESSION ISOLATION (v6.1+ — P15)
# ─────────────────────────────────────────────
# Per-step clean-session automation. After 5.6 CHECKPOINT @Main suggests /clear
# according to `mode`; the SessionStart hook (Claude Code) and session.created
# plugin (OpenCode) inject pending-step context on the new session.
#   mode: per_step       — nudge after every 5.6 (vertical-slicing default)
#   mode: per_milestone  — nudge only before 5.7 RECONCILE / 5.10 diff-review
#   mode: overflow_only  — nudge only on slice-cap overflow / replan / BLOCKED
#   prompt_style: silent — additionalContext only (CC) / .session-bootstrap.md only (OC)
#   prompt_style: stderr — visible reminder before first input
#   prompt_style: both   — silent injection + visible reminder
session_isolation:
  mode: per_step
  prompt_style: both

# ─────────────────────────────────────────────
# AUTO-COMMIT PER STEP (v6.1+ — P12)
# ─────────────────────────────────────────────
# Commit after every @Reviewer CLEAN at @Main step 5.4b. Required for
# /kit-step-resume and /kit-revert-step (both anchor to per-step commits).
# Set false only if external commit policy conflicts; /kit-step-resume then
# falls back to /kit-resume semantics.
auto_commit_per_step: true

# ─────────────────────────────────────────────
# ALLOW INTERNAL STEPS (v6.1+ — P13)
# ─────────────────────────────────────────────
# Runnable-slice gate at @Main step 3a. False (default) requires every plan
# step to declare a user-visible `Runnable: <one line>` field. True allows
# `Runnable: internal — <reason>` for pure-backend modules with no UI surface.
allow_internal_steps: false

# ─────────────────────────────────────────────
# CI HOST (v6.0+ — P10)
# ─────────────────────────────────────────────
# Set to "github" if you also include the `ci-github` capability profile in
# stack.profiles below. The kit will render .github/workflows/kit-gates.yml
# mirroring the in-session lint/compile/test gates plus a bypass-marker scan.
# Required iff `ci-github` is in stack.profiles (schema enforces this).
ci_host: none

# ─────────────────────────────────────────────
# HOSTS (1..N — projects can run on OpenCode, Claude Code, or both)
# ─────────────────────────────────────────────
# Each host name renders its own template tree into the target:
#   opencode    → .opencode/ + opencode.json + AGENTS.md
#   claude-code → .claude/   + .claude/settings.json + CLAUDE.md
# Multi-host installs render both side-by-side; subagents in .opencode/agents/
# and .claude/agents/ share their bodies via the kit's _shared/ tree.
hosts: [opencode]

# ─────────────────────────────────────────────
# PROJECT
# ─────────────────────────────────────────────
project:
  name: "My Project"
  description: "Brief one-line description of the project"

# ─────────────────────────────────────────────
# KNOWLEDGE VAULT
# ─────────────────────────────────────────────
# Path (relative to project root) where KnowledgeOS stores all agent-generated docs.
# Default: vault/. v5 uses a flat layout: features/<module>/<feature>/feature.md +
# test-cases.md per feature, plus shared guidelines/ and tech-debt/ subtrees.
vault_path: vault

# ─────────────────────────────────────────────
# STACK
# ─────────────────────────────────────────────
# Profiles are picked along five orthogonal axes (see README → "Available profiles"):
#   language    (exactly 1):  kotlin-gradle | make-generic
#   framework   (0..N):       compose-multiplatform | paper-plugin
#   host        (1..N):       opencode | claude-code     ← matches the `hosts:` list above
#   provider    (1 if opencode in hosts, else 0): routerai | ollama-cloud
#   capability  (0..N):       security-baseline (always-on) | solid | clean-architecture
#                              | requirements-pipeline (no-op in v5+) | quality-gates
stack:
  language: kotlin
  profiles:
    - kotlin-gradle           # language
    - compose-multiplatform   # framework
    - opencode                # host
    - routerai                # provider (only because opencode is a host)
    - security-baseline       # capability (auto-added if missing)
    - solid                   # capability (SOLID + class-level OO design)
    - clean-architecture      # capability (system-level layering / ports & adapters / boundary DTOs)
    - quality-gates           # capability (opt-in test-quality + traceability forbidden patterns)
    # - ci-github             # capability (v6+, P10 — renders .github/workflows/kit-gates.yml; needs ci_host: github)
    # - requirements-pipeline # capability (legacy, no-op in v5+ — Analyst is always on)

  # external_profiles is populated automatically by /kit-extend when you add a
  # profile fetched from a URL outside this kit's repo.
  # external_profiles:
  #   my-team-style: https://github.com/my-org/my-kit-extras/blob/master/profiles/capability/my-team-style.yaml

  build_command: "./gradlew"
  compile_command: "./gradlew compileKotlin"
  lint_command: "./gradlew detekt ktlintCheck"
  test_command: "./gradlew :[module]:test"   # [module] is a literal placeholder

# ─────────────────────────────────────────────
# MODULES
# ─────────────────────────────────────────────
modules:
  - name: server
    gradle_module: ":server"
    source_root: "server/src/main/kotlin/com/example/"
    test_root: "server/src/test/kotlin/com/example/"
    docs_path: "vault/server/"
    responsibility: "Ktor server, business logic, auth"

  - name: client
    gradle_module: ":composeApp"
    source_root: "composeApp/src/commonMain/kotlin/com/example/"
    test_root: "composeApp/src/commonTest/kotlin/com/example/"
    docs_path: "vault/client/"
    responsibility: "Compose Multiplatform UI, session management"

# ─────────────────────────────────────────────
# PROVIDER (OpenCode only — required iff opencode ∈ hosts; env var NAME, never the actual key)
# ─────────────────────────────────────────────
provider:
  name: routerai
  base_url: https://routerai.ru/api/v1
  api_key_env: ROUTERAI_OPENCODE

# ─────────────────────────────────────────────
# MODELS (OpenCode only — required iff opencode ∈ hosts)
# ─────────────────────────────────────────────
models:
  default: moonshotai/kimi-k2.6
  coder: qwen/qwen3-coder-next       # @CodeWriter, @BugFixer
  reviewer: deepseek/deepseek-v4-pro # default for @Architect, @Verifier — see architect/verifier overrides below
  small: qwen/qwen3-coder-next
  # v7.0.0+ — optional dedicated models for the consolidated agents.
  # If unset, both fall back to `reviewer`. Uncomment + set if you want a
  # different model for either entry point (e.g. stronger model for the
  # single Architect pass that produces the entire spec).
  # architect: openai/gpt-5.4
  # verifier: deepseek/deepseek-v4-pro

# ─────────────────────────────────────────────
# CLAUDE_CODE (required iff claude-code ∈ hosts; omit otherwise)
# ─────────────────────────────────────────────
# Models accept the Claude Code CLI aliases (opus, sonnet, haiku) which resolve
# to the latest model in each tier, or full IDs (claude-opus-4-7, claude-sonnet-4-6,
# claude-haiku-4-5).
# claude_code:
#   models:
#     default: sonnet      # orchestrator (main session role)
#     coder: opus
#     reviewer: opus
#     designer: opus       # set to null to omit @Designer agent
#     small: haiku

# ─────────────────────────────────────────────
# MCP INTEGRATIONS
# ─────────────────────────────────────────────
mcp:
  context7:
    enabled: true
    api_key_env: CONTEXT7_API_KEY

  knowledge:
    enabled: true
    url: http://localhost:8085/mcp

  serena:
    enabled: true                    # set false for non-JVM projects

# ─────────────────────────────────────────────
# LSP
# ─────────────────────────────────────────────
lsp:
  enabled: true
  command: kotlin-lsp
  extensions: [".kt", ".kts"]

# ─────────────────────────────────────────────
# UI / DESIGNER
# ─────────────────────────────────────────────
ui:
  framework: "Compose Multiplatform"   # null → omit @Designer agent
  platforms: ["Desktop", "Android", "iOS"]
  colors:
    - name: "Brand Primary"
      hex: "#2A6FF1"
      purpose: "Primary accent / CTA"
    - name: "Background"
      hex: "#FFFFFF"
      purpose: "Page background"
    - name: "Text Primary"
      hex: "#0F172A"
      purpose: "Body text"

# ─────────────────────────────────────────────
# CODE QUALITY (forbidden patterns surfaced in AGENTS.md and @CodeWriter)
# ─────────────────────────────────────────────
code_quality:
  forbidden_patterns:
    - "!! operator (use requireNotNull/checkNotNull with message)"
    - "GlobalScope.launch (always use a scoped coroutine)"
    - "Thread.sleep in suspend code (use delay())"
    - "Empty catch blocks"
    - "Bare Exception/Throwable catch (catch specific types)"
    - "TODO() in production code without a DECISIONS.md entry"
    - "Raw SQL string concatenation with user input (use parameterized queries)"

# ─────────────────────────────────────────────
# FORMATTER (auto-fix on save)
# ─────────────────────────────────────────────
formatter:
  enabled: true
  name: "gradle-detekt-format"
  command: ["./gradlew", "detekt", "--auto-correct"]
  extensions: [".kt", ".kts"]
