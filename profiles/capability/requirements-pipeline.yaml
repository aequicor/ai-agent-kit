# ai-agent-kit profile: Requirements Pipeline (legacy / no-op in v5)
#
# In v4, this profile added a 5-agent chain (BusinessAnalyst, CornerCaseReviewer,
# CoverageChecker, SystemAnalyst, ConsistencyChecker) plus a `requirements-pipeline`
# skill that orchestrated them.
#
# v5 (2026-05-08) merged that whole chain into the single @Analyst agent which
# always runs at FEATURE step 2 (ANALYSIS) regardless of whether this profile is
# present. The profile is therefore a **no-op** in v5+.
#
# It is kept as a profile YAML so manifests written against v4 continue to
# validate and `/kit-update` does not need to remove it. New installs do not need
# to add it.
#
# Once you have run /kit-update to v5+ you may remove this entry from
# stack.profiles[] in your manifest, but doing so is not required — the merge
# is a no-op either way.

_profile_name: requirements-pipeline
_profile_description: "Legacy v4 capability — no-op in v5+, kept for back-compat. Analyst replaces the v4 chain."
_profile_axis: capability
