## Использование

Язык агентов задаётся переменной окружения `OPENCODE_LANG` в шелле перед запуском OpenCode:

```bash
export OPENCODE_LANG=ru
```

OpenCode не поддерживает ключ `environment` в `opencode.json` — переменную нужно выставлять в окружении процесса. Дефолт устанавливается при установке кита через `language_code` в манифесте.
