<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0f18"/>
      <stop offset="100%" stop-color="#181c2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Mark: rounded square with 3-node graph -->
  <g transform="translate(96 184)">
    <rect width="120" height="120" rx="26" fill="#6366f1"/>
    <g stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none">
      <line x1="60" y1="36" x2="36" y2="84"/>
      <line x1="60" y1="36" x2="84" y2="84"/>
      <line x1="36" y1="84" x2="84" y2="84"/>
    </g>
    <circle cx="60" cy="36" r="11" fill="#ffffff"/>
    <circle cx="36" cy="84" r="11" fill="#ffffff"/>
    <circle cx="84" cy="84" r="11" fill="#ffffff"/>
  </g>

  <!-- Title -->
  <text x="248" y="265" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="84" font-weight="800" fill="#e2e6f8" letter-spacing="-2">
    ai-agent-kit
  </text>

  <!-- Subtitle -->
  <text x="248" y="318" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="32" font-weight="500" fill="#a5b4fc">
    14+ AI specialists. Five-minute install. Fewer defects.
  </text>

  <!-- Stats row -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
     font-size="22" fill="#9299b8" font-weight="500">
    <text x="96" y="490">14+ AI specialists in one team</text>
    <text x="96" y="528">8 quality checks before each release</text>
    <text x="96" y="566">0 scripts or servers to install</text>
  </g>

  <!-- Hosts pill -->
  <g transform="translate(620 460)">
    <rect width="496" height="40" rx="20" fill="rgba(99,102,241,0.15)" stroke="rgba(99,102,241,0.4)" stroke-width="1"/>
    <text x="248" y="27" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
          font-size="18" font-weight="600" fill="#a5b4fc" text-anchor="middle">
      Works with Claude Code &amp; OpenCode
    </text>
  </g>

  <!-- Version pill -->
  <g transform="translate(620 514)">
    <rect width="120" height="40" rx="20" fill="rgba(34,211,160,0.12)" stroke="rgba(34,211,160,0.3)" stroke-width="1"/>
    <text x="60" y="27" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
          font-size="18" font-weight="700" fill="#22d3a0" text-anchor="middle">
      v4.5.0
    </text>
  </g>

  <!-- Footer URL -->
  <text x="96" y="600" font-family="ui-monospace, 'SF Mono', Menlo, monospace"
        font-size="18" fill="#6b7296">
    github.com/aequicor/ai-agent-kit
  </text>
</svg>
