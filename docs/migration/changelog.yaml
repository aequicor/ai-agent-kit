versions:
  - version: "7.0.0-beta"
    released: "2026-05-08"
    breaking: false
    description: |
      Agent consolidation infrastructure. v7.0.0-beta ships TWO new
      consolidated agent bodies — @Architect (replaces @Analyst + @Designer)
      and @Verifier (replaces @TestKeeper + @Reviewer + @DoDGate +
      @TraceabilityChecker) — alongside the existing legacy bodies. Per-merger
      manifest flags decide which is dispatched. Default is legacy path
      (consolidated_*=false), so this release is zero-impact at upgrade unless
      PO opts in.

      Why ship both: the v7 proposal (PIPELINE_V7_PROPOSAL.md § 4 П5) requires
      data-validated consolidation — gates with signal_ratio < threshold over
      30 tasks become deprecation candidates; agents get the same treatment.
      Without v6.3's gates.csv data accumulated, slamming 9→5 in one release
      would be the same intuition-driven move v7 was designed to avoid.
      v7.0.0-beta provides the infrastructure for A/B testing; v7.0.0-stable
      will remove legacy bodies once data validates the merger.

      ## P22 — manifest.agents block (consolidation flags)

      New manifest section, fully optional:

        agents:
          consolidated_architect: false   # @Analyst + @Designer → @Architect
          consolidated_verifier: false    # 4-agent merge → @Verifier

      When false (default) → @Main dispatches the legacy 4-agent / 2-agent
      separations exactly as in v7.0.0-alpha. Zero behavioural change.

      When true → @Main dispatches the consolidated agent. Output formats
      match legacy on a per-mode basis; gates.csv ids are stable across
      both paths so signal_ratio aggregation in /kit-status compares
      configurations directly.

      ## @Architect — consolidates @Analyst + @Designer

      Single dispatch produces:
        - spec.md (Why / ACs / Edge Cases / How / Test plan / Open questions)
        - plan.md skeleton (slice budget headers + empty section blocks)
        - ## UI / UX section (only when UI_REQUIRED=true: TYPE=FEATURE AND
          manifest.ui.framework != null AND PO confirmed UI surface affected)

      Saves one dispatch per UI feature (no separate @Designer turn). Designer's
      Chain-of-Thought (UX problem → information hierarchy → interaction flow
      → platform notes → accessibility → states → animation) is integrated
      into Architect's Pass 1 when UI_REQUIRED=true. Reflection (Pass 2)
      checklist extended with UI-specific checks (every screen has Color
      reference; every Component has States ladder).

      Body: kit/_shared/agents/Architect.body.md.template.
      Host wrappers: kit/.claude/agents/Architect.md.template,
                     kit/.opencode/agents/Architect.md.template.

      ## @Verifier — consolidates @TestKeeper + @Reviewer + @DoDGate +
                     @TraceabilityChecker

      Mode-driven single agent. Each MODE invocation matches the legacy
      agent's behaviour exactly:

        GENERATE / DRAFT / EXECUTE / RECONCILE / RERUN / SCAN / APPEND
                                              ← was @TestKeeper modes
        REVIEW                                ← was @Reviewer (5 passes + A* if Critical-EC)
        DOD                                   ← was @DoDGate (7 hard checks)
        TRACE                                 ← was @TraceabilityChecker (4-pass matrix)

      Saves four dispatches across the per-step verification chain (5.3 → 5.4
      → 5.7 → 5.8 → 5.9). Per-mode telemetry preserved: gates.csv logs the
      same gate ids (build, review-correctness, review-scope, ..., dod,
      traceability) regardless of which roster is dispatched.

      Body: kit/_shared/agents/Verifier.body.md.template (MODE dispatch table
      + per-mode behaviour summaries; references legacy bodies for the
      detailed pass logic to avoid duplication during the coexistence period).
      Host wrappers: kit/.claude/agents/Verifier.md.template,
                     kit/.opencode/agents/Verifier.md.template.

      Mode-driven dispatch matches Anthropic context-engineering guidance
      (smallest set of high-signal tokens) — only the section matching the
      input MODE is "active" in any single dispatch; other modes are
      reference documentation the agent reads contextually.

      ## models.architect / models.verifier with fallback

      New optional model role assignments:

        models:
          architect: <model>     # for consolidated @Architect
          verifier: <model>      # for consolidated @Verifier

      If absent → fallback chain:
        architect → reviewer
        verifier  → reviewer

      The reviewer fallback matches the legacy bodies (Analyst, Designer,
      Reviewer, DoDGate, TraceabilityChecker all use models.reviewer in
      v6.x). Explicit architect/verifier assignment lets PO bind a different
      model when consolidating (e.g. dedicated stronger model for the
      single Architect entry-point).

      Same fallback applies to claude_code.models.architect /
      claude_code.models.verifier when claude-code is the host.

      ## Main.body.md.template — § "Agent dispatch decision"

      New section above § "Lane pipeline variants" documents the dispatch
      logic for both consolidated_architect and consolidated_verifier.
      Pseudocode form: `if manifest.agents.consolidated_*: dispatch
      @<consolidated>; else dispatch @<legacy_pair_or_quartet>`.

      Mid-task flag flips are forbidden (`/kit-config refuses if
      .planning/CURRENT.md.active_task is set`); PO must finish or revert
      the active task before changing consolidation flags.

      ## What this release does NOT change

      - No legacy agent bodies modified. @Analyst, @Designer, @TestKeeper,
        @Reviewer, @DoDGate, @TraceabilityChecker, @CodeWriter, @BugFixer,
        @Main are unchanged.
      - No mandatory consolidation. consolidated_* flags default false; the
        upgrade from v7.0.0-alpha to v7.0.0-beta is zero-impact at default
        manifest.
      - No agent name changes. @CodeWriter is NOT renamed to @CodeAgent in
        this release; the v7 proposal anticipated the rename but it offers
        no functional improvement on its own. Postponed to v7.0.0-stable.
      - No mutation-sample skill. Critical lane backend ground-truth still
        requires PO to attach a mutation-sample report manually; v7.0.0
        stable will wrap mutation-generation inside @Verifier.

      ## Recommended A/B path

        1. Stay on consolidated_architect=false, consolidated_verifier=false
           for ~30 tasks to accumulate baseline gates.csv signal_ratio per
           legacy gate (analyst-spec, designer-ui, build, review-correctness,
           ...).
        2. Flip consolidated_architect=true for 15 tasks. Compare /kit-status
           signal_ratio for analyst-spec/designer-ui (now 0%) vs
           architect-spec/architect-ui (newly accumulated). If quality holds
           or improves, keep enabled.
        3. Flip consolidated_verifier=true. Same comparison for
           build/review-*/dod/traceability gates.
        4. v7.0.0-stable will remove legacy bodies once aggregate data across
           the user community validates the mergers.

      ## Migration path position

        v6.2 (research foundation) → v6.3 (telemetry) →
        v7.0.0-alpha (lanes opt-in) → v7.0.0-beta (THIS; agent consolidation
        opt-in) → v7.0.0-stable (lanes mandatory + consolidated mandatory +
        legacy bodies removed; data-driven once accumulated).

      v7.0.0-stable timing depends on accumulated signal_ratio data across
      the user community — the kit ships when the data is in, not on a
      release calendar.
    files_changed:
      - kit/_shared/agents/Architect.body.md.template
      - kit/_shared/agents/Verifier.body.md.template
      - kit/.claude/agents/Architect.md.template
      - kit/.claude/agents/Verifier.md.template
      - kit/.opencode/agents/Architect.md.template
      - kit/.opencode/agents/Verifier.md.template
      - kit/_shared/agents/Main.body.md.template
      - kit/manifest.schema.json
      - manifest.example.yaml
    manifest_changes:
      added_fields:
        - path: "agents.consolidated_architect"
          default: false
          description: "v7.0.0-beta+ (P22) — when true, @Main dispatches @Architect (single body merging Analyst + Designer) instead of @Analyst + @Designer separately. Saves one dispatch per UI feature. Default false until v7.0.0-stable."
        - path: "agents.consolidated_verifier"
          default: false
          description: "v7.0.0-beta+ (P22) — when true, @Main dispatches @Verifier with MODE={GENERATE|DRAFT|EXECUTE|RECONCILE|RERUN|SCAN|APPEND|REVIEW|DOD|TRACE} instead of @TestKeeper / @Reviewer / @DoDGate / @TraceabilityChecker separately. Saves four dispatches across the per-step verification chain. Default false until v7.0.0-stable."
        - path: "models.architect"
          default: null
          description: "v7.0.0-beta+ — model for the consolidated @Architect (OpenCode side). Required iff agents.consolidated_architect=true. If absent, kit falls back to models.reviewer."
        - path: "models.verifier"
          default: null
          description: "v7.0.0-beta+ — model for the consolidated @Verifier (OpenCode side). Required iff agents.consolidated_verifier=true. If absent, kit falls back to models.reviewer."
        - path: "claude_code.models.architect"
          default: null
          description: "v7.0.0-beta+ — model for the consolidated @Architect (Claude Code side). Falls back to claude_code.models.reviewer if absent."
        - path: "claude_code.models.verifier"
          default: null
          description: "v7.0.0-beta+ — model for the consolidated @Verifier (Claude Code side). Falls back to claude_code.models.reviewer if absent."

  - version: "7.0.0-alpha"
    released: "2026-05-08"
    breaking: false
    description: |
      Lane-triage opt-in. Adds risk-based pipeline routing (trivial / standard
      / critical) as a fully opt-in feature. v6.x pipeline is preserved
      verbatim when `manifest.lanes.enabled: false` (default), so the version
      is technically non-breaking — the MAJOR bump signals the v7 roadmap
      milestone, not a breaking schema change.

      Why MAJOR despite non-breaking: PIPELINE_V7_PROPOSAL.md defined v7.0.0
      as the lane-triage release. Shipping it as alpha first lets PO opt in,
      gather data via v6.3 telemetry, and validate the lane heuristics before
      v7.0.0-beta consolidates agents (9→5) and v7.0.0-stable makes lanes
      mandatory. Per-major versioning aligns the public roadmap with the
      release vehicle.

      Three lanes available when enabled: true:

        trivial  — ≤1 file, ≤30 lines, no new public symbols. Pipeline
                   collapses to: @CodeWriter → @Reviewer (Pass A only) →
                   ground-truth → commit. Skips ANALYSIS, DoDGate,
                   TraceabilityChecker, RECONCILE, 5.10 diff-review.
                   Saves ~70% tokens for tiny tasks. Auto-reclassifies to
                   standard on overflow (file count, line count, public
                   symbol introduction).

        standard — current v6.3 pipeline. Default fallback. Unchanged.

        critical — standard + pre-mortem skill mandatory + Reviewer
                   adversarial 2nd pass on every step (not just Critical-EC)
                   + ≥3 mutants killed for backend ground-truth + sleep mode
                   forbidden + diff-review never auto-approved + tdd_first
                   forced regardless of test_strategy.

      Activation requires explicit `manifest.lanes.enabled: true`. With
      enabled false (default), the entire lane system is dormant — risk is
      classified for telemetry but pipeline behaves exactly like v6.3.

      ## P21 — manifest.lanes block

      New manifest section. All defaults are non-breaking.

        lanes:
          enabled: false                          # opt-in
          default_risk: standard                  # fallback
          trivial_max_files: 1
          trivial_max_lines: 30
          trivial_no_new_public_symbols: true
          critical_block_sleep: true
          critical_require_mutation_sample: true
          auto_classify: true

      ## Step 0a CLASSIFY extended

      @Main now performs risk classification at Step 0a:

      1. Parse PO's task description for explicit `--risk=trivial|standard|critical`.
      2. If no flag AND auto_classify=true → infer risk from heuristics:
         - critical keywords: auth, token, secret, password, credential,
           migration, schema change, external API, webhook, third-party,
           security surface answer = yes.
         - trivial: ≤1 file, ≤30 lines, no new public symbols, no
           security-surface keywords.
         - standard: default fallback.
      3. Surface classified risk to PO in clarifying-questions message
         with --risk override hint.
      4. PO can dispute by passing --risk on the next message.
      5. Critical + sleep is refused at /kit-sleep entry by default.

      Once classified, risk is recorded in:
        .planning/CURRENT.md.risk
        .planning/tasks/<slug>.md.risk

      Mid-flight upgrades allowed (standard → critical when Critical EC
      discovered). Downgrades are forbidden — once a risk is set, it sticks.

      ## /kit-new-feature extended

      Accepts `--risk=<value>` flag (or `--risk <value>` space-separated).
      Multiple flags allowed (e.g. `--sleep --risk=standard`). Risk is
      passed through to @Main. Combination `--sleep --risk=critical` is
      refused at startup if `lanes.critical_block_sleep: true`.

      ## /kit-sleep extended

      Pre-flight gate added:
      - Refuses critical risk if `lanes.critical_block_sleep: true`.
      - Advises about `Bash(git reset --hard *)` allowlist requirement
        (BLOCKED-shutdown uses git reset; without allowlist, the harness
        prompts mid-sleep and defeats autonomous mode).

      ## Lane pipeline variants — § "Lane pipeline variants" in Main body

      New documentation section covers the trivial / critical overlays
      explicitly. Standard lane = v6.3 pipeline as documented in the
      existing "Pipeline — FEATURE" / "Pipeline — TECH" sections.

      ## What this release does NOT change

      - Agents unchanged (still 9). v7.0.0-beta will consolidate to 5
        based on gates.csv data.
      - Mutation-sample skill not yet shipped. Critical lane requires PO to
        attach a mutation-sample report (e.g. via PIT, Stryker, etc.); the
        kit does not generate it. v7.0.0-beta wraps mutation-generation in
        @Verifier.
      - Pure-text and refactor lanes not separated. Refactor stays in
        standard lane with TECH pipeline; future v7.x may split.
      - Lane manifest field `enabled: false` keeps EXACT v6.3 behaviour.
        Kit upgrades from v6.3 to v7.0.0-alpha are zero-impact unless PO
        flips `enabled: true`.

      ## Migration path

        v6.3 (telemetry) → v7.0.0-alpha (this; lanes opt-in) →
        v7.0.0-beta (agent consolidation 9→5 based on data) →
        v7.0.0 stable (lanes mandatory; ground-truth mandatory in critical).

      Recommended path for PO:
        1. Stay on v6.3 for ~30 tasks to accumulate gates.csv signal.
        2. /kit-update to v7.0.0-alpha (no behaviour change at default
           manifest).
        3. Set `lanes.enabled: true` for the first feature; observe trivial
           lane behaviour on a small task.
        4. Adjust manifest defaults per project needs (e.g. raise
           trivial_max_lines for chatty projects).
        5. Wait for v7.0.0-beta agent consolidation (release cadence
           depends on accumulated data quality).
    files_changed:
      - kit/_shared/agents/Main.body.md.template
      - kit/_shared/commands/kit-new-feature.md.template
      - kit/_shared/commands/kit-sleep.md.template
      - kit/manifest.schema.json
      - manifest.example.yaml
    manifest_changes:
      added_fields:
        - path: "lanes.enabled"
          default: false
          description: "v7.0.0-alpha+ (P21) — opt-in for the lane-triage system. false (default) = pipeline behaves exactly like v6.3. true = @Main classifies risk at Step 0a and routes through trivial / standard / critical lane variants."
        - path: "lanes.default_risk"
          default: standard
          description: "v7.0.0-alpha+ — fallback risk when @Main cannot determine from heuristics and PO did not pass --risk explicitly. standard is the safe default."
        - path: "lanes.trivial_max_files"
          default: 1
          description: "v7.0.0-alpha+ — max files a trivial-lane task may touch before auto-reclassifying to standard."
        - path: "lanes.trivial_max_lines"
          default: 30
          description: "v7.0.0-alpha+ — max lines added+removed for a trivial-lane task before auto-reclassifying."
        - path: "lanes.trivial_no_new_public_symbols"
          default: true
          description: "v7.0.0-alpha+ — trivial lane forbids new public functions/types/endpoints/exports. Set false to allow."
        - path: "lanes.critical_block_sleep"
          default: true
          description: "v7.0.0-alpha+ — refuse /kit-sleep for critical-lane tasks. Highest blast-radius combination; default true blocks at startup."
        - path: "lanes.critical_require_mutation_sample"
          default: true
          description: "v7.0.0-alpha+ — critical lane backend steps require ≥3 mutants killed (vs ≥1 for standard backend)."
        - path: "lanes.auto_classify"
          default: true
          description: "v7.0.0-alpha+ — let @Main infer risk from heuristics (file count, public-API touch, security-surface keywords). false = always require explicit --risk flag, missing flag falls back to default_risk."

  - version: "6.3.0"
    released: "2026-05-08"
    breaking: false
    description: |
      Telemetry-only iteration. Closes the data side of the v7 self-cleaning
      gate-evaluation mechanism (PIPELINE_V7_PROPOSAL.md § 8). v6.2 gave us
      defects.csv (P19); v6.3 gives us gates.csv (P20) — together they let
      the kit answer "which gates earn their token cost" with rolling
      data instead of intuition.

      No agents change. No new pipeline branches. No new manifest fields
      that affect behaviour outside telemetry. This release is a pure
      observability layer; it is the prerequisite for v7's data-driven
      agent consolidation (9→5).

      ## P20 — gate_signal_ratio infrastructure

      New skill `gate-telemetry` (`kit/_shared/skills/gate-telemetry/`) is
      invoked at every gate verdict and appends one row to
      `evals/runs/<kit_version>/gates.csv`. Opt-in by directory presence
      (same convention as eval-collector and defects.csv).

      Schema (one row per gate fire):
        timestamp, task_slug, step, gate, verdict, blocked_close,
        false_positive, lane, reason

      Logged gates (16 total):
        - 3a — slice-cap, runnable-slice
        - 5.1 — token-budget
        - 5.3 — build
        - 5.4 — review-correctness, review-scope, review-bypass,
                review-runbook, review-adversarial (Critical-EC only)
        - 5.4a — unchanged-call-sites (info)
        - 5.6 — runbook-complete, ground-truth
        - 5.7 — reconcile
        - 5.8 — traceability
        - 5.9 — dod
        - 5.10 — diff-review

      PO commands also emit read-only events: defect-origin, revert-step,
      ground-truth-waiver.

      ## eval-collector skill extended

      At task CLOSE, eval-collector now reads gates.csv and computes
      per-gate signal_ratio (blocking_fires / total_fires) into the per-task
      `<task_slug>.md` § "Gate signals (v6.3+)".

      Cross-references defects.csv to mark false_negatives:
        - If defect.origin maps to a gate (mapping in skill body) AND that
          gate logged `pass` for the same step before the defect was
          reported → the gate missed; annotated with `*` + footnote.
        - false_positive remains `unknown` at write time; updated only when
          PO invokes /kit-defect with optional `--false-positive=<gate>`
          (v6.3 partial; full attribution is v7+).

      ## /kit-status extended

      When `evals/runs/<kit_version>/` exists, /kit-status appends two new
      sections:

      1. "Gate signal — rolling over last N tasks" — table of fires/blocks/
         signal_ratio per gate, ordered ascending. Rows below
         `manifest.telemetry.signal_ratio_threshold` AND without
         false_negatives are highlighted 🟡 deprecation_candidate. Rows
         with false_negatives > 0 are highlighted 🔴 missed_defects.

      2. "Defect origin distribution" — top-5 histogram of /kit-defect
         --origin values across the same window.

      Window size and threshold are read from manifest.telemetry.

      ## New manifest block

      `manifest.telemetry`:
        gates_log_enabled (default true)
        evaluation_window_tasks (default 30)
        signal_ratio_threshold (default 0.05)

      All defaults are safe — for projects without `evals/runs/`, the entire
      telemetry stack is dormant.

      ## Migration position

      Per PIPELINE_V7_PROPOSAL.md § 9:
        v6.2 (done) → v6.3 (this; telemetry foundation) →
        v7.0.0-alpha (lanes opt-in) → v7.0.0-beta (agent consolidation
        based on defects.csv + gates.csv data) → v7.0.0 stable.

      The proposal recommended ~30 tasks of v6.3 operation before v7-alpha
      to gather meaningful signal. In practice we ship v6.3 + v7.0.0-alpha
      together (both backward-compatible, both opt-in for the new behaviour),
      so PO can choose to enable lanes early or wait for telemetry data.

      ## What this release does NOT change

      - No agent prompt rewrites. All 9 agents keep their v6.2 bodies.
      - No pipeline branches. CLASSIFY → ANALYSIS → PLAN → CONFIRM → EXECUTE
        → CLOSE is unchanged.
      - No new gates beyond the telemetry meta-gate (`gate-telemetry` skill
        itself is not a "gate" in the verdict sense).
      - Existing v6.2 task files keep parsing. New step_commits[].defects
        and ground_truth fields from v6.2 work as before.
    files_changed:
      - kit/_shared/skills/gate-telemetry/SKILL.md.template
      - kit/_shared/skills/eval-collector/SKILL.md.template
      - kit/_shared/agents/Main.body.md.template
      - kit/_shared/commands/kit-status.md.template
      - kit/manifest.schema.json
      - manifest.example.yaml
    manifest_changes:
      added_fields:
        - path: "telemetry.gates_log_enabled"
          default: true
          description: "v6.3+ (P20) — master switch for gate-telemetry skill. true = log every gate verdict to evals/runs/<kit_version>/gates.csv (skipped silently if directory absent). false = suppress all gate-csv writes."
        - path: "telemetry.evaluation_window_tasks"
          default: 30
          description: "v6.3+ — rolling window size for /kit-status gate-signal aggregation. Larger window = more stable ratio, slower to react to drift."
        - path: "telemetry.signal_ratio_threshold"
          default: 0.05
          description: "v6.3+ — gates with rolling signal_ratio below this threshold AND no false_negatives are flagged 🟡 deprecation_candidate by /kit-status. Per PIPELINE_V7_PROPOSAL § 8.2."

  - version: "6.2.0"
    released: "2026-05-08"
    breaking: false
    description: |
      Research-aligned foundation release. Closes the highest-ROI gaps from
      external research (Anthropic context-engineering and harness guidance,
      2024–2026 papers on LLM-as-reviewer reliability, mutation testing vs
      coverage, agent failure modes) without disturbing v6.1's overall shape.
      The full v7 redesign (3 risk lanes, 9→5 agent consolidation) is staged
      for later — see PIPELINE_V7_PROPOSAL.md at repo root.

      All five additions are backward-compatible:
      - existing v6.1 task files keep parsing (legacy `step_commits[]` entries
        without `kind` field default to `kind: step`);
      - new manifest fields have safe defaults;
      - ground-truth gate can be disabled project-wide via
        `manifest.ground_truth.required: false` for spike/exploration repos.

      ## P0 — /kit-revert-step non-destructive (v6.2.0)

      Switched from `git reset --hard <prev_sha>` to `git revert <sha>`. Same
      PO-visible semantics (step is undone, plan.md restores [ ] checkbox),
      but:
        - Working copy is updated by NEW commits (one revert per reverted step);
          original commits stay in history. Squash on merge cleans this up.
        - No harness destructive-action permission gate (the v6.1 double-
          permission bug is gone — PO's in-band /kit-approve is sufficient).
        - step_commits[] entries gain a `kind` field (default `step`,
          new value `revert`); originals are marked `superseded: true` and
          new revert entries are appended.
        - Pre-flight requires clean working tree (revert refuses to mix
          uncommitted PO edits into the revert commit; v6.1 simply discarded
          them).
        - Conflict path: `git revert --abort`, surface options to PO (revert
          later steps first, or resolve manually).
      Sleep mode BLOCKED-shutdown still uses `git reset --hard <last_green>`
      (its design assumes wholesale reset to last green); /kit-sleep startup
      now warns PO if `Bash(git reset --hard *)` is not in
      `.claude/settings.json` permissions, otherwise harness will prompt
      mid-sleep and defeat the autonomous mode.

      ## P17 — token-budget slice cap

      Added `manifest.slice_caps.max_tokens_per_step` (default 30000, 0 to
      disable). Backed by Anthropic context-engineering "smallest set of
      high-signal tokens" guidance + research showing LLM-as-reviewer
      accuracy degrades with prompt complexity.

      Enforced at 5.1 EXTRACT (after STEP_CONTEXT bundle is built, before
      dispatch to subagents). On overflow:
        - @Main trims optional sub-bundles in priority order (REPO_MAP excerpt
          → unrelated test-cases rows → distant How-it-works subsections).
        - If still over → BLOCKED with reason OVERFLOW_TOKENS, escalation
          identical to other slice-cap overflows.
        - In sleep mode → BLOCKED-shutdown (cap is user-set, never auto-raised).
      Final bundle size recorded in `step_commits[N].context_tokens` for
      telemetry (feeds future v7 analysis of token-cost per gate).

      ## P18 — ground-truth artefact gate at 5.6 CHECKPOINT

      Mandatory non-AI verification artefact at 5.6 before `/kit-approve`.
      Backed by Anthropic harness guidance: e2e through browser automation /
      command output / contract tests is critical, juries unit tests miss
      real-world failures.

      Per-step PO attaches one of (type inferred by @Main from step nature):
        ui       → screenshot or preview-snapshot
        api      → contract-test pass with real payload
        cli      → command-output diff before/after
        backend  → mutation-sample (≥1 mutant killed; ≥3 for Critical-EC)
        refactor → diff-stat + smoke test (no user-visible change)

      New command `/kit-attach <path>` records the artefact into
      `step_commits[N].ground_truth = {type, path, summary, waived: false,
      attached_at}`.

      Override paths:
        - per-step: `/kit-approve --no-ground-truth` — logged as technical
          debt in test-cases.md Defects log under Source: ground-truth-waived.
          Surfaces the class of defect this gate catches in the waiver text
          so PO sees what they're trading off.
        - project-wide: `manifest.ground_truth.required: false` — logged
          once per task in step_commits[1].notes, not per step.
        - module-level: `manifest.ground_truth.exclusions.modules: [name]`
          — useful for headless modules with no visual surface.
        - sleep mode: auto-WAIVED with loud note in MORNING_REPORT.md
          § Open questions (sleep accepted defer-by-opt-in).

      Anti-Loop table extended with new STOP condition: 5.6 reached without
      ground-truth artefact AND override not invoked → block /kit-approve
      until either attached or overridden.

      ## P19 — defect_origin telemetry

      `/kit-defect <description>` now also accepts `--origin=<value>` flag
      (or prompts PO once if absent). Valid values:
        spec | code | review | test | ui | trace | scope | unknown

      Recorded in:
        - test-cases.md Defects log entry (Origin field)
        - step_commits[N].defects[] array
        - evals/runs/<kit_version>/defects.csv (one row per defect; created
          with header if absent; opt-in by directory presence, same pattern
          as eval-collector skill)

      defects.csv columns: timestamp, task_slug, step, tc_id, severity,
      origin, found_by, ground_truth_attached, lane.

      eval-collector skill extended to read defects.csv at task CLOSE and
      aggregate per-task histograms (by origin, by severity,
      ground_truth_attached_ratio) into the per-task <task_slug>.md record.

      Purpose: feed the v7 § 8.2 exit criterion — gates with signal_ratio
      < 5% over 30 tasks are candidates for redesign or deletion. Without
      data, agent consolidation (9→5) is intuition; with data it is decision.

      ## Reference: research basis

      External:
        - Anthropic engineering: "Effective context engineering for AI agents"
          (smallest high-signal tokens, sub-agent dispatch with condensed
          summaries) → P17.
        - Anthropic engineering: "Effective harnesses for long-running agents"
          (e2e through browser automation critical; unit tests miss real-world
          failures) → P18.
        - LLM-as-reviewer reliability: arXiv:2505.20206, arXiv:2509.01494,
          ICSE 2025 calibration paper (~68% accuracy ceiling, complex
          prompting ↑ misjudgment) → motivates P18 ground-truth, P19 origin
          telemetry.
        - Meta ACH (mutation testing > coverage for finding real bugs) → P18
          backend artefact type.
        - Failure modes (operational hallucination, scope drift, cascading)
          → P0 keep-non-destructive, P17 token-budget.

      Internal:
        - PIPELINE_V7_PROPOSAL.md (full redesign, this release stages the
          first wave).
        - docs/process-review-v6.1.md (early diagnosis + P0 motivation).

      ## What this release does NOT change (deliberate)

      Deferred to v7.0.0 to preserve v6.1 stability:
        - Agent consolidation 9→5 (Architect = Analyst+Designer; Verifier =
          TestKeeper+Reviewer+DoDGate+TraceabilityChecker). Needs prompt
          rewrites + telemetry validation.
        - 3 risk lanes (trivial/standard/critical). Triage + lane branching
          is significant pipeline restructure.
        - Mutation-sample as a generic skill (currently the artefact is
          attached by PO; future v7 wraps mutation-generation in @Verifier).
      Migration path: v6.2 (this) → v6.3 (telemetry-only iteration) →
      v7.0.0-alpha (lanes opt-in, agents unchanged) → v7.0.0-beta (agent
      consolidation per defects.csv data) → v7.0.0 stable.
