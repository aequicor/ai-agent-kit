versions:
  - version: "2.2.0"
    released: "2026-05-05"
    breaking: false
    description: |
      Restructured the test-cases template to separate AI-owned data from
      manual-tester-owned content.

      The file now has two parts:

      1. A compact table at the top, filled by AI agents (@QA, @TestRunner,
         @BugFixer). Columns: ID | Status | Notes | Type | Pre-requirements | To be.
         The Notes column doubles as a defect link — when a TC fails the agent
         writes `DEF-NNN: <one-line cause>` there. The manual tester may also
         edit Notes to record bug remarks.

      2. Detailed TC sections below the table, written by the manual tester
         using a standardized 4-block format: Pre-requirements / Steps / As is /
         To be. Agents do NOT write or edit these sections.

      Old test-cases files (with the wide table: Pri | Source | Preconditions |
      Steps | Expected | Status | Notes | Bug Ref) keep working — agents will
      continue to update Status/Notes columns. The new column layout applies
      only to newly generated files. To migrate an existing file, regenerate
      it via @QA REQUIREMENTS phase, or manually fold the old columns:
        - Drop "Pri" (priority is now expressed via Type).
        - "Source" tag → move into Notes.
        - "Preconditions" → "Pre-requirements" (rename column).
        - "Steps", "Expected" → move into a detailed section below the table.
        - "Bug Ref" → fold into Notes as `DEF-NNN: <cause>`.

      Updated files:
      - kit/.vault/_templates/test-cases.md — new template structure.
      - kit/.opencode/skills/test-execution/SKILL.md — generation/execution
        rules updated to the new format.
      - kit/.opencode/agents/QA.md.template — new template, Source moved to Notes.
      - kit/.opencode/agents/TestRunner.md.template — drop Pri/Bug Ref,
        Notes column holds DEF-id reference.
      - kit/.opencode/agents/BugFixer.md.template — DEF-id read from Notes,
        forbid editing detailed sections.
      - kit/.opencode/agents/Main.md.template, kit/.opencode/commands/fix.md —
        renamed Bug Ref → DEF-id.
      - kit/.opencode/agents/CoverageChecker.md.template — deferred note now
        lives in the `To be` cell instead of `Expected Result`.
    files_changed:
      - kit/.vault/_templates/test-cases.md
      - kit/.opencode/skills/test-execution/SKILL.md
      - kit/.opencode/agents/QA.md.template
      - kit/.opencode/agents/TestRunner.md.template
      - kit/.opencode/agents/BugFixer.md.template
      - kit/.opencode/agents/Main.md.template
      - kit/.opencode/agents/CoverageChecker.md.template
      - kit/.opencode/commands/fix.md
    manifest_changes:
      added_fields: []

  - version: "2.1.3"
    released: "2026-05-05"
    breaking: false
    description: |
      Fix: renamed OPPENCODE_LANG (double-P typo) to OPENCODE_LANG throughout the kit.

      The misspelling meant that setting OPENCODE_LANG=ru in the environment had no
      effect — agents were looking for OPPENCODE_LANG and never found the variable.

      _shared.md.template is also updated to instruct agents to check OPENCODE_LANG
      from the process environment at runtime, falling back to the install-time
      default baked in during setup. This makes runtime language switching work
      without re-running /update.
    files_changed:
      - kit/.opencode/_shared.md.template
      - kit/.opencode/i18n/en.yaml
      - kit/.opencode/i18n/ru.yaml
    manifest_changes:
      added_fields: []

  - version: "2.1.2"
    released: "2026-05-05"
    breaking: false
    description: |
      Fix: corrected Ollama Cloud base URL from https://ollama.com to https://ollama.com/v1.

      @ai-sdk/openai-compatible appends /chat/completions directly to baseURL, so the
      correct value must include the /v1 path segment. Without it the SDK was hitting
      https://ollama.com/chat/completions instead of https://ollama.com/v1/chat/completions,
      causing connection failures on every request after kit installation.
    files_changed:
      - profiles/provider/ollama-cloud.yaml
    manifest_changes:
      added_fields: []

  - version: "2.1.1"
    released: "2026-05-05"
    breaking: false
    description: |
      Fix: removed invalid top-level "environment" key from opencode.json.template.

      OpenCode does not support an "environment" key at the config root — using it
      produces "Unrecognized key: 'environment'" on startup. The locale value is now
      embedded directly into _shared.md via the {{OPPENCODE_LANG}} template variable
      so agents always see the active locale without any environment variable.
    files_changed:
      - kit/opencode.json.template
      - kit/.opencode/_shared.md.template
      - kit/manifest.schema.json
    manifest_changes:
      added_fields: []

  - version: "2.1.0"
    released: "2026-05-05"
    breaking: false
    description: |
      Added multilingual support (English + Russian).

      New optional manifest field `language_code` (default: `en`) controls the
      `OPPENCODE_LANG` environment variable that is now automatically written into
      `opencode.json`. Agents read this variable at startup to use the matching
      locale file from `.opencode/i18n/<locale>.yaml`.

      setup.md gains a new Q0 that asks PO for the preferred language before
      any other question. The answer is stored in the manifest and rendered into
      `opencode.json` during installation.

      ru.yaml is now complete — all task names, commands, and statuses are
      translated. Previous installs that already set `OPPENCODE_LANG` manually
      in `opencode.json` are unaffected; the new field simply automates that step.
    files_changed:
      - kit/opencode.json.template
      - kit/manifest.schema.json
      - kit/.opencode/i18n/ru.yaml
    manifest_changes:
      added_fields:
        - path: "language_code"
          default: "en"
          description: "Agent output language code — sets OPPENCODE_LANG in opencode.json. Supported: en, ru."

  - version: "2.0.0"
    released: "2026-05-05"
    breaking: true
    description: |
      Profiles reorganised into four orthogonal axes
      (language / framework / provider / capability). Each profile now
      declares `_profile_axis` (replacing `_profile_category`) and is
      restricted by `kit/profile.schema.json` to fields its axis owns.
      Cross-axis selections are conflict-free by construction; the merge
      algorithm now raises an error on overlapping scalars instead of
      silently letting "right side win" (the bug where ollama-cloud quietly
      disabled kotlin-lsp).

      Profile renames / splits:
        - kotlin-multiplatform   → kotlin-gradle (language) + compose-multiplatform (framework)
        - minecraft-paper-plugin → kotlin-gradle (language) + paper-plugin (framework)
        - generic                → make-generic (language)
        - ollama-cloud           → kept (provider), stripped of lsp/formatter/code_quality
        - solid                  → kept (capability), `_profile_category` → `_profile_axis`
        - requirements-pipeline  → kept (capability), `_profile_category` → `_profile_axis`

      New profiles:
        - routerai          (provider) — default, extracted from previous defaults
        - security-baseline (capability) — universal hygiene patterns,
          auto-included in every install (deduplicates the secrets/SQL/PII
          patterns that previously lived in every stack profile)

      Setup prompt now asks one question per axis (Q4a–d) and validates
      cardinality (exactly one language, exactly one provider).

      Migration for existing manifests:
        - Replace `kotlin-multiplatform` in stack.profiles with
          `[kotlin-gradle, compose-multiplatform]`.
        - Replace `minecraft-paper-plugin` with `[kotlin-gradle, paper-plugin]`.
        - Replace `generic` with `make-generic`.
        - If no provider profile is listed, add `routerai` (or `ollama-cloud`).
        - Add `security-baseline` to the capability list.
    files_changed:
      - profiles/kotlin-gradle.yaml
      - profiles/make-generic.yaml
      - profiles/compose-multiplatform.yaml
      - profiles/paper-plugin.yaml
      - profiles/routerai.yaml
      - profiles/security-baseline.yaml
      - profiles/ollama-cloud.yaml
      - profiles/solid.yaml
      - profiles/requirements-pipeline.yaml
      - kit/profile.schema.json
      - kit/manifest.schema.json
      - docs/prompts/setup.md
      - manifest.example.yaml
      - README.md
    manifest_changes:
      added_fields: []
      profile_transforms:
        - rename:
            from: kotlin-multiplatform
            to: [kotlin-gradle, compose-multiplatform]
        - rename:
            from: minecraft-paper-plugin
            to: [kotlin-gradle, paper-plugin]
        - rename:
            from: generic
            to: [make-generic]
        - ensure: [security-baseline]
        - ensure_axis:
            axis: provider
            default: routerai

  - version: "1.0.0"
    released: "2026-05-04"
    breaking: false
    description: |
      Initial release of ai-agent-kit. Forked and trimmed from
      opencode-kit v1.6.0 with the following key changes:
        - QA + RequirementsQA agents merged into a single @QA with phase parameter
          (REQUIREMENTS / IMPLEMENTATION). RequirementsQA.md.template is removed.
        - The living test-cases file <feature>-test-cases.md is now the central
          artifact for /fix. It is created by @QA in the requirements pipeline,
          appended by @QA in the implementation pipeline, updated by @TestRunner
          (SCAN/EXECUTE/RERUN/APPEND modes), and updated by @BugFixer
          (Status ❌→✅, Defects log 🔴→🟢) after each fix.
        - /fix without arguments scans the test-cases file for ❌/⏸ rows and
          asks PO which to fix. With a TC-id, fixes that one. With free-form
          text, creates a new TC and fixes it. PO can edit the file by hand.
        - Bug pipeline reorganized: INTAKE → SCAN/TRIAGE → DEBUG → DISPATCH
          (BugFixer) → RE-VERIFY (TestRunner RERUN) → REPORT.
        - Install path: pure-AI prompt at docs/prompts/setup.md. No Python,
          no JDK, no curl-jar. Update path: /update command (in installed kit)
          → docs/prompts/update.md.
        - Stack profiles trimmed to: kotlin-multiplatform, minecraft-paper-plugin,
          generic. Provider profile: ollama-cloud. Capability profile:
          requirements-pipeline.
        - Editor support trimmed to opencode (cursor and copilot dropped).
        - Removed: scripts/ (Python apply.py, apply_remote.py, run_evals.py,
          core/*.py), tests/, evals/, Dockerfile, docker-compose.yaml,
          pyproject.toml, .pre-commit-config.yaml, .github/workflows/.
    files_changed: []
    manifest_changes:
      added_fields: []
