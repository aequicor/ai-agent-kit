         (Skip files that don't exist — earlier kit versions had a smaller
         command set.)

      3. Update any project-local docs, READMEs, or onboarding notes that
         reference the old command names.

      No manifest field changes. `kit_version` simply moves 2.4.0 → 3.0.0.
