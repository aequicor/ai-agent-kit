versions:
  - version: "5.2.0"
    released: "2026-05-07"
    breaking: false
    description: |
      Closes the two remaining backlog items from the v5.1 self-audit.
      Both shipped as **optional** skills (removable without breaking the
      kit) — base pipelines run unchanged when either is absent.

      ## 1. replan-on-discovery (adaptive replanning)

      New skill `kit/_shared/skills/replan-on-discovery/SKILL.md`. Replaces
      immediate escalation with a bounded plan amendment when an
      EXECUTE-phase agent discovers a structural gap (not a fix-in-place
      issue). Four trigger patterns:

        - **Pattern A** — @Reviewer flags AC-violation root in spec
          (code right, spec wrong).
        - **Pattern B** — @TestKeeper RECONCILE finds a Critical/High EC
          uncovered with no plan step owning it.
        - **Pattern C** — @TraceabilityChecker reports ENDPOINT_ORPHAN on
          a Critical surface.
        - **Pattern D** — @CodeWriter returns BLOCKED on a missing
          dependency from a future step.

      Hard caps prevent runaway scope:

        - Max 2 replan events per feature (counted across feature.md
          markers and task-file entries).
        - Max 3 new steps per replan event.
        - Replan only amends `§ Implementation plan`; never touches
          `§ Acceptance Criteria` or `§ Edge Cases` (those are @Analyst's
          domain).
        - 3rd structural discovery → fall through to v5.1 escalation.

      Replan respects `auto_approve.feature` (or matching class flag): if
      `false`, await /kit-approve after amendment is written; if `true`,
      log "auto-approved replan-N" and continue. PO can refuse a replan
      with /kit-approve denied; @Main escalates with reason.

      Wired into @Main FEATURE pipeline at:
        - Step 5.2 (CodeWriter BLOCKED → consider Pattern D)
        - Step 5.4 (Reviewer CRITICAL on spec-alignment → consider Pattern A)
        - Step 5.7 (RECONCILE flags Critical EC uncovered → consider Pattern B)
        - Step 5.8 (TraceabilityChecker ENDPOINT_ORPHAN → consider Pattern C)

      ## 2. eval-collector (auto-telemetry)

      New skill `kit/_shared/skills/eval-collector/SKILL.md`. Auto-fills
      `evals/runs/<kit_version>/<task-slug>.md` at task CLOSE so eval
      runs do not require manual transcription of every metric.

      **Honest about what is automatable:**

        - **Auto (~70% of fields):** turns (checkpoint count), wall time
          (timestamp delta), artifact counts and sizes (filesystem stat),
          DoD verdict (parse feature.md), AC/EC/TC counts (parse markdown
          tables), replan events (count REPLAN-N markers), test verdicts
          (test-cases.md Status column).
        - **Manual (~30%):** total tokens (provider dashboard only),
          post-CLOSE bug rate (24h window), subjective notes.

      Auto-discovery: skill checks `evals/runs/` directory presence as
      the opt-in signal. No manifest field. PO who wants tracking does
      `mkdir -p evals/runs/<kit_version>`; PO who doesn't, leaves it
      absent and skill is no-op (no warning, no log entry).

      Cross-host: pure prompt + filesystem operations, no hooks needed.
      Identical behaviour on OpenCode and Claude Code.

      Long-horizon-aware: detects `tier: long-horizon` in seed-task files
      and additionally fills sessions_used, replan_events,
      steps_planned/executed, escalations.

      Wired into:
        - FEATURE step 6 CLOSE (after CHECKPOINT, before task archive)
        - BUG step 4 CHECKPOINT
        - TECH step 6 CLOSE (inherited from FEATURE structure)

      ## Net change

      - Skills: 6 → 8 (both new ones optional, kit works without them).
      - Main.body: +1 section ("Replan-on-discovery") + 4 trigger lines.
      - _shared.md: skill list reorganized into "core" + "optional" buckets.

      ## Files affected

      - **NEW:** `kit/_shared/skills/replan-on-discovery/SKILL.md.template`
      - **NEW:** `kit/_shared/skills/eval-collector/SKILL.md.template`
      - **MODIFIED:** `kit/_shared/agents/Main.body.md.template` (4 trigger points + Replan section + CLOSE eval-collector hook)
      - **MODIFIED:** `kit/_shared/_shared.md.template` (skill list reorganization)
      - **MODIFIED:** `kit/_index.txt`
      - **MODIFIED:** `manifest.example.yaml` (kit_version)
      - **MODIFIED:** `README.md` (version badge + skill count)

      ## Migration

      Backward-compatible. v5.1 manifests validate against v5.2 schema
      unchanged. v5.1 installs that run /kit-update receive both new
      skills automatically; replan-on-discovery activates at the first
      structural-gap trigger; eval-collector remains dormant unless PO
      creates `evals/runs/<kit_version>/` in the project root.

      Removing either skill: `rm -r vault/.opencode/skills/<name>` (or
      `.claude/skills/<name>`) — kit falls through to v5.1 behaviour
      cleanly. No manifest edit required.
    files_changed:
      - kit/_shared/skills/replan-on-discovery/SKILL.md.template
      - kit/_shared/skills/eval-collector/SKILL.md.template
      - kit/_shared/agents/Main.body.md.template
      - kit/_shared/_shared.md.template
      - kit/_index.txt
    manifest_changes:
      added_fields: []

  - version: "5.1.0"
    released: "2026-05-07"
    breaking: false
    description: |
      Closes the three production gaps identified by the v5.0 self-audit
      (see commit 191dd0d):

      1. **Deterministic enforcement layer** — Claude Code lifecycle hooks
         (PreToolUse, SessionStart, Stop) for things prompt rules cannot
         reliably enforce: hard-deny `git push --force` to main/master,
         hard-deny writes to credential files, pre-commit sync check
         (src/ staged without test or test-cases.md → ask PO), and a
         session-start context loader that surfaces active task + branch.
         OpenCode parity: tightened `permission` table in `opencode.json`
         covers the same patterns through bash-pattern allow/ask/deny.
         Both hosts now reach the same deterministic guardrail level.

      2. **Granular auto_approve** — `auto_approve` accepts either a
         boolean (back-compat with v5.0) or an object with per-class flags
         (`feature`, `tech`, `techdebt`, `bug.{low|medium|high|critical}`).
         Lets PO auto-drain low-severity bug fixes and tech-debt batches
         while still confirming new features and CRITICAL bugs by default.
         Resolution rule documented in `@Main`'s "Auto-approve flag"
         section; missing object keys default to `false` (safe).

      3. **Long-horizon eval tier** — addresses the [SWE-EVO 2026]
         (https://arxiv.org/html/2512.18470v1) finding that short-horizon
         evals saturate while long-horizon ones stay sensitive to
         architecture changes. Two new seed tasks
         (feature-004 multi-module data export, tech-002 extract shared
         domain), a tier-specific metrics document
         (`evals/long-horizon-tier.md`) covering sessions used / replan
         events / cross-day continuity / build-green checkpoint rate, and
         updates to `evals/README.md` and `evals/metrics.md` to track
         long-horizon as a separate tier with its own pass criteria.

      ## Cross-platform hook design

      Hooks are written in cross-platform Node.js (`.mjs`) per
      [Claude Code 2026 cross-platform guidance]
      (https://claudefa.st/blog/tools/hooks/cross-platform-hooks).
      Settings.json invokes them as `node .claude/hooks/<name>.mjs` —
      Node.js is required by Claude Code on every platform, so no
      bash/PowerShell wrappers are needed. All three hooks are fail-soft:
      any internal error → exit 0 with no JSON, agent falls through to
      the permission table. A broken hook never blocks the agent.

      ## Affected files

      - **NEW:** `kit/.claude/hooks/{session-start-context,pre-tool-bash-guard,stop-status-reminder}.mjs`
      - **NEW:** `kit/.claude/hooks/README.md`
      - **NEW:** `evals/seed-tasks/feature-004-multi-module-data-export.md`
      - **NEW:** `evals/seed-tasks/tech-002-extract-shared-domain.md`
      - **NEW:** `evals/long-horizon-tier.md`
      - **MODIFIED:** `kit/.claude/settings.json.template` (hooks block + node hooks/* in allow-list)
      - **MODIFIED:** `kit/opencode.json.template` (denied push to main/master/prod, denied .env writes via redirects/cp/mv/tee)
      - **MODIFIED:** `kit/manifest.schema.json` (auto_approve as oneOf bool|object)
      - **MODIFIED:** `kit/_shared/agents/Main.body.md.template` (auto_approve resolution rule)
      - **MODIFIED:** `kit/_shared/_shared.md.template` (HITL gates table + deterministic enforcement section)
      - **MODIFIED:** `manifest.example.yaml` (granular form documented)
      - **MODIFIED:** `evals/README.md` and `evals/metrics.md` (long-horizon tier rows + columns)

      ## Migration

      Backward-compatible: existing v5.0.0 manifests with `auto_approve: false`
      or `auto_approve: true` continue to validate unchanged. New
      installations on `claude-code` host receive the hooks scripts and
      wired settings.json automatically; on `opencode` they receive the
      tightened permission table. Existing v5.0.0 installs that run
      `/kit-update` get all of the above without any manifest changes
      required from the PO. To enable the granular `auto_approve` form,
      PO can run `/kit-config enable auto_approve.techdebt` (or set the
      keys directly in the manifest).
    files_changed:
      - kit/.claude/hooks/session-start-context.mjs
      - kit/.claude/hooks/pre-tool-bash-guard.mjs
      - kit/.claude/hooks/stop-status-reminder.mjs
      - kit/.claude/hooks/README.md
      - kit/.claude/settings.json.template
      - kit/opencode.json.template
      - kit/manifest.schema.json
      - kit/_shared/agents/Main.body.md.template
      - kit/_shared/_shared.md.template
      - kit/_index.txt
    manifest_changes:
      added_fields: []

  - version: "5.0.0"
    released: "2026-05-07"
    breaking: true
    description: |
      Major restructure — agent-pipeline simplification and single-doc-per-feature
      vault layout. Driven by 2025–2026 multi-agent research consensus
      (Cognition "Don't Build Multi-Agents", Anthropic "Building Effective
      Agents", Princeton NLP, Berkeley MAST taxonomy): for tightly-coupled
      tasks like coding, fewer agents with shared context outperform large
      orchestrator-worker chains, and artifact sprawl directly correlates with
      PO comprehension failure. v5 cuts agent count from 19 to 9, skills from
      15 to 6, commands from 17 to 12, Definition-of-Done checks from 25 to 7,
      per-feature artifacts from 7–10 files to 2–3.

      ## Agent merges (-10 net)

      - **@Analyst (new)** — single-pass design author. Replaces v4 chain
        @BusinessAnalyst → @CornerCaseReviewer (BUSINESS) → @QA (REQUIREMENTS) →
        @CoverageChecker → @SystemAnalyst → @CornerCaseReviewer (TECHNICAL) →
        @ConsistencyChecker. Self-reflection loop replaces the 3× CCR phases.
      - **@Reviewer (new)** — single read-only review. Replaces v4
        @CodeReviewer + @SecurityReviewer + STUB-SCAN regex. One agent reads
        the diff once and runs three internal passes (code/security/stub).
      - **@TestKeeper (new)** — owns test-cases.md end-to-end. Replaces v4
        @QA + @TestExecutor + @TestRunner. Modes: GENERATE / DRAFT / EXECUTE /
        RECONCILE / RERUN / SCAN / APPEND.
      - **@BugFixer** absorbs v4 @Debugger as `MODE=debug`. Same agent, two modes.
      - **Removed**: @AutoApprover (replaced by `auto_approve` manifest flag),
        @PromptEngineer (meta utility, not in core pipeline),
        @CornerCaseReviewer (3 modes folded into @Analyst self-reflection
        and @Reviewer Pass A), @CoverageChecker (folded into @TestKeeper coverage rule),
        @ConsistencyChecker (folded into @Analyst Pass 2 reflection),
        @Debugger (folded into @BugFixer MODE=debug).
      - Kept: @Main, @CodeWriter, @BugFixer, @DoDGate, @Designer,
        @TraceabilityChecker.

      ## Skill cuts (-9 net)

      Removed: requirements-pipeline (now @Analyst is unconditional),
      stage-shape-check (now @Reviewer Pass A6), corner-case-refinement
      (inlined in @Analyst), code-review-checklist (inlined in @Reviewer),
      test-execution (inlined in @TestKeeper), session-handoff (just call
      /kit-resume), session-replay, knowledge-graph (unused), mermaid-validate
      (kit-diagram removed). Kept: bug-retro, definition-of-done, look-up,
      pre-mortem (now optional, not mandatory), spec-to-code-trace, tech-debt-record.

      ## Command cuts (-5 net)

      Removed: kit-checkpoint (use /kit-status), kit-deploy (project-specific,
      out of scope), kit-diagram (Mermaid output removed; agents may still
      embed diagrams in feature.md How-it-works), kit-requirements-pipeline
      (Analyst is automatic), kit-update-deps (rare, out of scope). Removed
      from documentation: /kit-approve-with-dod-waiver (no waiver mechanism in
      v5 — if a check fails, fix it). Kept: kit-new-feature, kit-fix,
      kit-techdebt, kit-resume, kit-status, kit-approve, kit-review, kit-lint,
      kit-config, kit-extend, kit-update, kit-uninstall.

      ## Pipeline simplification

      FEATURE pipeline reduced from **8 step groups with 5 nested loops** to
      **6 sequential steps with 1 inner loop per step**:

      ```
      v4: 0a → 0.5 → 1 (req-pipeline) → 2 → 3 → 4 → 5 → 5a → 5b → 5c → 6 → 7 (5 loops) → 7a → 7b‖7c → 7d → 7e → 8
      v5: 1 CLASSIFY → 2 ANALYSIS → 3 PLAN → 4 CONFIRM → 5 EXECUTE (CodeWriter→TestKeeper→Reviewer) → 6 CLOSE
      ```

      Pre-mortem skill is now optional, not mandatory (use case must justify it).
      Walkthrough gate (step 7d) and the @AutoApprover dispatch are removed.

      ## Definition of Done — 25 → 7 hard checks

      v4 DoD had 8 groups × ~25 binary checks plus a waiver mechanism
      (`/kit-approve-with-dod-waiver`) for UNVERIFIED rows. PO could not
      reason about 25 checks; waivers invited "soft pass" culture.

      v5 DoD has 7 hard checks (must all PASS) plus an info-only diagnostic
      block. There is no waiver mechanism. Coverage thresholds and
      WEAK_ASSERTION flags are info-only — they don't block CLOSE.

      ## Vault layout — 7+ files per feature → 2–3

      v4 used a Diátaxis-style layout with one file per concern:
      `concepts/<m>/requirements/<f>.md`, `concepts/<m>/plans/<f>-corner-cases.md`,
      `concepts/<m>/plans/<f>-plan.md`, `reference/<m>/spec/<f>.md`,
      `reference/<m>/spec/<f>-test-plan.md`, `reference/<m>/spec/<f>-trace.md`,
      `reference/<m>/spec/<f>-dod.md`, `reference/<m>/test-cases/<f>-test-cases.md`,
      `how-to/<m>/plans/<f>-stage-NN.md` (×N).

      v5 collapses all of that into:
      ```
      vault/features/<module>/<feature>/
        feature.md       — Why / ACs / Edge Cases / How it works / Test plan / Implementation plan / DoD
        test-cases.md    — live state
        retro.md         — optional, only if bugs/lessons recorded
      ```

      The Implementation plan steps live as sections inside feature.md, not as
      separate `stage-NN.md` files. The `concepts/`, `reference/`, `how-to/`,
      `tutorials/` Diátaxis subtrees are gone. `guidelines/<module>/<topic>.md`,
      `guidelines/libs/`, and `tech-debt/<module>/` remain.

      ## New: manifest field `auto_approve`

      Replaces the v4 `AUTO_APPROVE=true` magic-string convention and the
      @AutoApprover agent. When `auto_approve: true` in the manifest, @Main
      skips the CONFIRM step (auto-proceeds from PLAN to EXECUTE). PO can
      still interrupt at any time. Other gates (DEPLOY, DESTROY,
      SECRET_ROTATE, MIGRATION, EXTERNAL_API) always require explicit
      /kit-approve. Default: false.

      ## Terminology cleanup

      - `Corner Case (CC)` → `Edge Case (EC)` in feature.md (more conventional).
      - `stage` → `step` in implementation plans (steps live inline in
        feature.md). The phrase "stage shape" is gone with the skill.
      - `vault/concepts`, `vault/reference`, `vault/how-to` Diátaxis terms removed.
      - Removed jargon: `BLOCKED` ceremony names, `AUTO_APPROVE` magic string,
        `walkthrough gate`, `dod_waiver:`, `(deferred to @SecurityReviewer)`.

      ## New: evaluation framework (evals/)

      Per Anthropic's research-system guidance, no agent change should be made
      blind. The new `evals/` directory contains 5 seed tasks (3 FEATURE, 2 BUG,
      1 TECH), a metrics template, and instructions for recording per-version
      runs in `runs/<version>/`. Use as a baseline before tuning further.

      ## Migration

      Existing installations on v4.x receive these changes via /kit-update.
      The `requirements-pipeline` capability profile is kept as a **no-op**
      stub (its YAML still validates; the v4 chain it activated is gone).
      Manifests do not need to remove it from `stack.profiles[]`, but doing
      so is harmless.

      Vault content from v4 (`concepts/`, `reference/`, `how-to/`, `tutorials/`
      subtrees) is **not** migrated automatically. /kit-update preserves user
      content and only re-renders kit-managed files. POs who want a clean v5
      vault layout should:

      1. Run /kit-update.
      2. Manually move per-feature artifacts: `concepts/<m>/requirements/<f>.md`
         + `reference/<m>/spec/<f>.md` + `reference/<m>/test-cases/<f>-test-cases.md`
         etc. into a single `features/<m>/<f>/feature.md` (the Analyst will do
         this on first dispatch for new features; old features can be migrated
         lazily).
      3. Move `guidelines/<m>/reports/<bug-name>.md` files into the relevant
         feature's `retro.md` if you want the retro history per-feature, or
         leave them where they are (the kit only looks at `features/` for new
         work).

      Sources for the design rationale:
      - Cognition — Don't Build Multi-Agents (cognition.ai)
      - Anthropic — Building Effective Agents (anthropic.com/research)
      - Anthropic — How we built our multi-agent research system (anthropic.com/engineering)
      - Princeton NLP single-vs-multi-agent benchmarking
      - Berkeley MAST 1600+ trace taxonomy of multi-agent failure modes (arXiv 2503.13657)
      - Andrew Ng — Four design patterns for AI agent workflows
      - Phil Schmid — Context Engineering Part 2

      Backward-compatible: NO. Manifests gain one new optional field
      (auto_approve, default false). Existing v4 manifests validate against v5
      schema unchanged. Old vault content is not touched. Old tasks
      (`.planning/tasks/<slug>.md`) referencing v4 paths still resolve to
      readable files — their content is untouched.
    files_changed:
