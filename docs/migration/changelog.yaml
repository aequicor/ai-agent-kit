  - version: "6.0.0"
    released: "2026-05-07"
    breaking: true
    description: |
      Structural release that closes three v5 gaps surfaced by the self-audit:
      scope drift, missing diff-review step, spec rot during replan. Eleven
      proposals (P1–P11) land together because P9 is breaking and the others
      compose cleanly with it.

      ## Breaking change — P9: spec/plan split

      The single `feature.md` per feature is replaced by two files:

        - `spec.md` — Why / ACs / Edge Cases / How it works / Test plan / UI
                       section. **FROZEN at @Main's CONFIRM step** — read-only
                       for the rest of the FEATURE pipeline. Replan-on-discovery
                       cannot touch it. AC/EC amendments require a fresh
                       @Analyst DRAFT cycle through PO.
        - `plan.md` — Slice budget / Implementation plan / Replan log /
                       Step-level diff stats / Diff-review / Definition of Done.
                       **Mutable across EXECUTE.** All EXECUTE-phase artifacts
                       live here.

      This stops the v5 failure mode where replans / DoD verdicts / diff stats
      accumulated inside the same file as the spec, and after 2–3 replan rounds
      the spec became unreadable. The split is along the **frozen-vs-mutable
      boundary**, not the document-genre boundary.

      Vault layout:
        v5: vault/features/<module>/<feature>/{feature.md, test-cases.md, retro.md?}
        v6: vault/features/<module>/<feature>/{spec.md, plan.md, test-cases.md, retro.md?}

      Every agent and skill that referenced feature.md was updated:
        - @Analyst writes both files (full spec.md + plan.md skeleton).
        - @CodeWriter, @Reviewer, @TestKeeper, @TraceabilityChecker, @BugFixer,
          @Designer read spec.md (frozen) and the relevant slice of plan.md.
        - @DoDGate reads spec.md + plan.md + test-cases.md; writes verdict to
          plan.md § Definition of Done; never touches spec.md.
        - replan-on-discovery skill amends only plan.md § Implementation plan.
        - definition-of-done, spec-to-code-trace, eval-collector, bug-retro,
          pre-mortem skills updated for the split.
        - kit-new-feature, kit-resume, kit-techdebt commands updated.
        - vault templates: feature.md template removed; spec.md and plan.md
          templates added.

      ## Non-breaking additions

      ### P1 — Hard slice caps

      New manifest field `slice_caps: {max_steps, max_files_per_step,
      max_lines_per_step}` (defaults 6 / 5 / 400). Enforced at @Main step 3a
      (after PLAN, before CONFIRM) and at every @CodeWriter step. Overflow →
      @Main asks PO to split (no auto-trim); @CodeWriter returns BLOCKED with
      reason=OVERFLOW. Slice caps are user-set; raising them is a manifest
      edit, not an in-flight decision @Main makes.

      ### P2 — Mandatory diff-review gate (step 5.10)

      Between EXECUTE and CLOSE, @Main runs `git diff --stat` over the EXECUTE
      range, fills plan.md § Diff-review, and waits for PO unless
      `auto_approve.diff_review: true`. The diff_review key is intentionally
      separated from feature/tech/bug auto-approves: setting `auto_approve:
      true` does NOT bypass diff-review. This is the one PO-eye step v6 adds
      and the one v5 lacked (PO never had to read the diff).

      Three resolution commands at the gate: /kit-approve, /kit-revert <file>,
      /kit-rework <reason>.

      ### P3 — Bypass-channel forbids in security-baseline

      Six new patterns in `profiles/capability/security-baseline.yaml`:
      @SuppressWarnings, @ts-ignore, # noqa, eslint-disable (file-level),
      --no-verify, @SuppressLint / ktlint-disable / detekt:suppress — all
      without a paired issue id or DECISIONS.md reference are CRITICAL findings
      via @Reviewer Pass A7. The same pattern set is mirrored in the
      `ci-github` workflow's bypass-scan job.

      ### P4 — @Reviewer Pass D (scope drift)

      For each file in CHANGED_FILES not in step.Files declaration:
      MEDIUM in same module, HIGH cross-module. Closes the "AI quietly improved
      a neighbouring file" channel — by far the most common AI-induced techdebt
      and the cheapest to prevent.

      ### P5 — Section-sliced dispatch

      @Main builds a per-step STEP_CONTEXT bundle containing only the AC/EC/TC
      rows + How-it-works subsections this step references — not the whole
      spec.md. Subagents (CodeWriter, Reviewer, TestKeeper) read STEP_CONTEXT
      first; they only open SPEC_DOC at full length when STEP_CONTEXT is
      insufficient. Eliminates 3-5× re-reading of a growing spec.md across
      step iterations.

      ### P6 — Step-level diff-stat checkpoints

      Every step records files / +lines / -lines / overflow / out-of-scope in
      plan.md § Step-level diff stats AND .planning/tasks/<slug>.md. Telemetry
      for tuning slice_caps; surfaces drift before it accumulates.

      ### P7 — Adversarial second pass for Critical-EC steps

      When step.Owned contains any Critical EC, @Reviewer runs a second read
      with the orientation "what is *missing*?" instead of "what is wrong?".
      One agent, two prompt orientations — defence against AI-reviewer
      convergence on the same blind spots as the author. Skipped for
      non-Critical-EC steps to keep cost proportional.

      ### P8 — Configurable test_strategy

      New manifest field: `test_strategy: tdd_first | test_after | mixed`
      (default tdd_first — same as v5). test_after writes production code
      first then tests against actual behaviour; mixed picks per sub-task
      (TDD for AC-bound, test_after for [exploratory]). Object form supports
      `allow_per_step_override` so plan.md steps can declare a per-step
      strategy.

      ### P10 — Real CI workflow

      New capability profile `ci-github` + manifest field `ci_host: github`.
      Renders kit/.github/workflows/kit-gates.yml mirroring in-session
      lint/compile/test gates AS REAL CI on every push and PR, plus a
      bypass-marker scan job that fails CI on unjustified
      @SuppressWarnings/@ts-ignore/--no-verify/etc. Without this profile,
      gates exist only during agent sessions — a PR merged via the GitHub
      web UI bypasses them.

      ### P11 — Unchanged-call-sites quick check (5.4a)

      After @Reviewer CLEAN, @Main does a serena/grep pass over the project
      (excluding step.Files) for call sites of the step's changed public
      symbols. Out-of-step call sites are appended to plan.md § Step-level
      diff stats as info (never blocks). Catches "forgot to update the
      migration / docs / sibling module".

      ## Pipeline shape (v5 → v6)

      v5 FEATURE: CLASSIFY → ANALYSIS → PLAN → CONFIRM → EXECUTE (5.1–5.9) → CLOSE
      v6 FEATURE: CLASSIFY → ANALYSIS → PLAN (3a slice-cap check) → CONFIRM
                  → EXECUTE (5.1 with EXTRACT → 5.2–5.4 → 5.4a unchanged-call-sites
                             → 5.5 → 5.6 with diff-stat → 5.7–5.9
                             → 5.10 mandatory diff-review) → CLOSE

      Same number of bookkeeping steps; new safety nets at 3a, 5.4a, 5.10.

      ## Files affected

      Schema:
        - kit/manifest.schema.json (slice_caps, test_strategy, ci_host,
                                    auto_approve.diff_review, ci-github gate)

      Profiles:
        - profiles/capability/security-baseline.yaml (P3 bypass forbids)
        - profiles/capability/ci-github.yaml (NEW — P10)

      Templates:
        - kit/.vault/_templates/spec.md (NEW — P9 frozen portion)
        - kit/.vault/_templates/plan.md (NEW — P9 mutable portion)
        - kit/.vault/_templates/feature.md (REMOVED — replaced by the two above)
        - kit/.github/workflows/kit-gates.yml.template (NEW — P10)

      Agents (all updated for P9 paths; specific Ps noted):
        - kit/_shared/agents/Main.body.md.template (P1, P2, P5, P6, P9, P11)
        - kit/_shared/agents/Analyst.body.md.template (P9 — writes both files)
        - kit/_shared/agents/CodeWriter.body.md.template (P1 OVERFLOW, P8, P9)
        - kit/_shared/agents/Reviewer.body.md.template (P3, P4, P7, P9)
        - kit/_shared/agents/TestKeeper.body.md.template (P9)
        - kit/_shared/agents/BugFixer.body.md.template (P9)
        - kit/_shared/agents/TraceabilityChecker.body.md.template (P9)
        - kit/_shared/agents/DoDGate.body.md.template (P9 — verdict to plan.md)
        - kit/_shared/agents/Designer.body.md.template (P9)

      Skills:
        - kit/_shared/skills/definition-of-done/SKILL.md.template (P9)
        - kit/_shared/skills/replan-on-discovery/SKILL.md.template (P9 — plan.md only)
        - kit/_shared/skills/eval-collector/SKILL.md.template (P9)
