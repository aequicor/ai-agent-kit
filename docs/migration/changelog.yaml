        - kit/_shared/skills/pre-mortem/SKILL.md.template (P9 — appends to plan.md)

      Shared / commands / hooks:
        - kit/_shared/_shared.md.template (P9, file-access matrix)
        - kit/_shared/FILE_STRUCTURE.md.template (P9)
        - kit/_shared/PROJECT_RULES.body.md.template (P9, P8 note)
        - kit/_shared/commands/kit-new-feature.md.template (P9, P1 mention)
        - kit/_shared/commands/kit-resume.md.template (P9 — resume context)
        - kit/_shared/commands/kit-techdebt.md.template (P9 — synth spec+plan)
        - kit/.claude/hooks/pre-tool-bash-guard.mjs (P9 — accepts spec.md/plan.md)
