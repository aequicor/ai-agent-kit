  - version: "6.1.0"
    released: "2026-05-07"
    breaking: false
    description: |
      Workflow-guarantees layer on top of v6.0. Adds five capabilities, all
      backward-compatible (opt-out via manifest flags; existing v6.0 tasks
      keep working through the upgrade):

      ## P12 — Per-step commit (step 5.4b)

      After every @Reviewer CLEAN, @Main runs `git add -A && git commit -m
      "step <N>: <goal>"` and records the sha in `.planning/tasks/<slug>.md.step_commits[]`.
      This makes /kit-step-resume and /kit-revert-step possible — both anchor
      to known-green per-step commits — and feeds plan.md § Diff-review §
      "Per-step diff" sub-table at 5.10. New manifest flag
      `auto_commit_per_step: true` (default) controls this. Setting it false
      degrades /kit-step-resume to /kit-resume semantics for projects with
      external commit policies.

      ## P13 — Runnable-slice gate at 3a

      Each plan step must declare a `Runnable: <one line>` field describing
      what PO will see in a local dev run after the step lands. @Main BLOCKs
      PLAN at 3a SLICE-CAP CHECK if any step is missing this field.
      `Runnable: internal — <reason>` is allowed only with new manifest flag
      `allow_internal_steps: true` (default false enforces vertical slicing).

      ## P14 — Runbook report at @CodeWriter Step 8

      @CodeWriter's Step 8 output now has FIVE mandatory sections (was: one
      Changed Files table):
        - Changed Files (columns: File / Action / Lines — `Description` column
          dropped; redundant with the new `Decisions I made` section).
        - How to verify (PO actionable steps in a local dev run).
        - Regression (which prior steps could be affected).
        - Known limitations (intentionally NOT done in this step).
        - Decisions I made (non-obvious choices for review/audit).

      Empty content = `(none)`. @Main BLOCKs 5.6 CHECKPOINT if any section is
      missing entirely. New @Reviewer Pass E ("Runbook quality") audits the
      runbook for completeness, vagueness, and stack-mismatch (verify steps
      referencing commands not in this project's stack).

      ## P15 — Clean-session-per-step automation

      New command `/kit-step-resume` (focused per-step bundle, narrower than
      /kit-resume; reads only the target step's slice + previous step's
      runbook + REPO_MAP).
      New command `/kit-map` generates `.planning/REPO_MAP.md` (modules /
      entry points / public APIs / file counts / lib deps / cross-module
      imports). Auto-suggested by /kit-update; refreshed on demand via
      `/kit-map --refresh`.
      New @Main step 5.6 CHECKPOINT 3-way fork: after machine-checks pass,
      PO chooses /kit-approve | /kit-defect <description> | /kit-revert-step.
      New commands `/kit-defect` (re-open step with PO-found defect, adds
      failing TC) and `/kit-revert-step` (destructive; git reset --hard to
      previous step's commit).
      Claude Code SessionStart hook (`session-start-context.mjs`) extended
      to detect pending step and emit dual-channel output: silent
      `additionalContext` JSON + visible stderr reminder. OpenCode equivalent:
      new plugin `.opencode/plugins/session-bootstrap.ts` on `session.created`
      and `session.compacted` events writes `.planning/.session-bootstrap.md`,
      which agents read at task start per updated _shared.md instruction.
      New manifest field `session_isolation: {mode, prompt_style}` controls
      when /clear is suggested and through which channel.

      ## P16 — Sleep mode (autonomous run)

      New command `/kit-sleep "<description>"` (also `/kit-new-feature --sleep
      "<description>"` — equivalent). Sets `.planning/CURRENT.md.mode: sleep`.
      Autonomous run: all CONFIRM/diff-review/replan gates auto-approve,
      retry budgets doubled (CodeWriter 6, Reviewer 6, DoDGate 5, replan 4),
      session_isolation forced to overflow_only, /kit-defect and
      /kit-revert-step disabled.

      Self-validation loop on failure: extended retry per failure mode, then
      auto-invocation of replan-on-discovery for structural failures.

      BLOCKED-shutdown procedure on unrecoverable failure:
        - Append to `.planning/MORNING_REPORT.md` with reason / last error /
          last green sha / agent's hypothesis for fix.
        - Optional `git reset --hard` to last green step (only if safe — no
          uncommitted PO changes outside the step's scope).
        - Set `.planning/CURRENT.md.status: SLEEP_BLOCKED, awaiting_po: true`.
        - Halt — do NOT proceed to next step.

      MORNING_REPORT.md (new template, gitignored): TL;DR + per-step rows +
      per-step runbooks + replan log + open questions/blocks + total diff +
      Suggested next action. PO reads on wake-up.

      Safety constraints sleep mode does NOT bypass: DEPLOY / DESTROY /
      SECRET_ROTATE / MIGRATION / EXTERNAL_API gates remain mandatory PO
      approval (hitting any → BLOCKED-shutdown). Pre-commit hook stays live.
      `--no-verify` forbidden under all conditions (kit/.claude/hooks/
      pre-tool-bash-guard.mjs hard-denies it). spec.md FROZEN-after-CONFIRM
      rule stays. Slice caps stay binding. /kit-revert is NOT auto-invoked.

      ## Reporting trim (housekeeping for the new layer)

      - `plan.md § Step-level diff stats` REMOVED. Single source of truth for
        per-step diff history is now `.planning/tasks/<slug>.md.step_commits[]`,
        which @Main appends at 5.4b. plan.md § Diff-review (5.10) renders the
        per-step breakdown by reading step_commits.
      - Verbose Timeline in task file collapsed to a single `Last-checkpoint:`
        line. step_commits[] is the historical record.
      - `Description` column in @CodeWriter Changed Files dropped (its content
        moved to "Decisions I made" runbook section).
      - kit/.claude/hooks/pre-tool-bash-guard.mjs gained sleep-mode awareness
        (auto-allow pre-commit sync ask in sleep) and v6.1 hard denies for
        --no-verify and --amend.

      ## Migration

      v6.0 → v6.1 is fully backward-compatible:
        - `step_commits[]` starts empty for legacy tasks; /kit-step-resume
          falls back to /kit-resume semantics when empty.
        - `current_step_idx` defaults to 0 on legacy task files (auto-added
          by /kit-update with this default).
        - `Runnable:` field is required for NEW plans (3a check); existing
          incomplete plans will hit the gate at the next CONFIRM cycle —
          @Main asks PO to add the field then.
        - `auto_commit_per_step: true` is the new default; teams with
          external commit policy can set it false after upgrade with no
          other changes.
        - `allow_internal_steps: false` is the new default; backend-only
          projects should flip it true.
        - `session_isolation: {mode: per_step, prompt_style: both}` default;
          override via /kit-config if you want different cadence.
        - Three new gitignore lines added to target `.gitignore` by
          `/kit-update` PHASE 3.8 (REPO_MAP.md, .session-bootstrap.md,
          MORNING_REPORT.md). All are local artifacts; never commit.
    files_changed:
