  - version: "4.3.2"
    released: "2026-05-06"
    breaking: false
    description: |
      Fix MCP servers not connecting in Claude Code installs.

      Problem: kit/.claude/settings.json.template carried a "mcpServers"
      key that the setup prompt rendered with the enabled MCP servers
      from the manifest. The file rendered cleanly, but Claude Code
      silently ignored those entries — "mcpServers" is not a recognized
      field in .claude/settings.json. Project-scope MCP server
      definitions live exclusively in .mcp.json at the project root,
      and settings.json only carries MCP policies (allow/deny lists).
      Result: users with claude-code as a host saw zero MCP servers
      connect even when their manifest enabled context7, knowledge,
      and serena.

      Fix:
        - Removed the "mcpServers" key (and its placeholder) from
          kit/.claude/settings.json.template.
        - Added kit/.mcp.json.template with body
          `{ "mcpServers": {{MCP_SERVERS_BLOCK}} }`. Setup renders it
          to <target>/.mcp.json only when claude-code ∈ hosts AND at
          least one MCP server is enabled — otherwise the file is not
          created (and is removed on update if it had become stale).
        - Updated docs/prompts/setup.md (Rule B3 + render-scope table),
          docs/prompts/update.md (root-files list), and
          docs/prompts/uninstall.md (added .mcp.json removal step) to
          reflect the new render target.

      No manifest schema change. Existing manifests work as-is — re-run
      /kit-update to materialize .mcp.json for Claude Code installs.
    files_changed:
      - kit/.claude/settings.json.template
      - kit/.mcp.json.template
      - kit/_index.txt
    manifest_changes:
      added_fields: []

  - version: "4.3.1"
    released: "2026-05-05"
    breaking: false
    description: |
      Fix infrastructure-failure bias in the requirements pipeline corner case
      analysis. Add a 7th attack axis — User Journey & Context — to both
      @CornerCaseReviewer (BUSINESS mode) and the corner-case-refinement skill.

      Problem: shipped corner case registers were dominated by server-down,
      rate-limit, async-timeout, and concurrent-user scenarios while everyday
      user-facing breakages went unexplored — return-to-draft, two-tab
      conflicts, navigation-back mid-flow, mobile/slow-connection UX, account
      in unusual state, locale mismatches, misclicked-but-reasonable buttons,
      first-run-without-prerequisite. Real users break features through these
      paths far more often than through infrastructure failures.

      Root cause: the 6-axis taxonomy weighted half of all axes (External
      Dependency Failures, Scale & Capacity, Temporal & Concurrency) toward
      infrastructure threat modelling. The remaining 3 axes covered user input
      but framed it as boundary attacks rather than journey gaps. The THINK
      step also primed agents to look for "the most dangerous aspect" —
      pushing toward catastrophic infra scenarios rather than typical
      user paths.

      Fix:
        - Added axis 7 "User Journey & Context" to CornerCaseReviewer BUSINESS
          mode with 11 concrete prompts (back navigation, two-tab use,
          stale drafts, account states, mobile/offline, accessibility,
          misclicks, locale, role switching, etc.).
        - Added category 7 to the corner-case-refinement skill taxonomy with
          the same lens.
        - Added a mandatory balance rule to both: at least one third of
          questions/rows must come from user-journey axes (1/2/3/7); category 7
          must produce ≥1 row for any UI-bearing feature.
        - Reframed the THINK step to ask explicitly about "the most common
          everyday user journey — and where could it silently break for a
          typical user?" alongside the existing danger-focused question.
        - Added a Red Flag for registers dominated by infrastructure failures
          and a balance check to Self-Review.

      No manifest changes. No host wrapper changes. Affects @CornerCaseReviewer
      (BUSINESS mode) and corner-case-refinement skill output only.
    files_changed:
      - kit/_shared/agents/CornerCaseReviewer.body.md.template
      - kit/_shared/skills/corner-case-refinement/SKILL.md.template
    manifest_changes:
      added_fields: []

  - version: "4.3.0"
    released: "2026-05-05"
    breaking: false
    description: |
      Make @CodeReviewer dispatch mandatory in EXECUTE; demote superpowers:executing-plans
      to a helper.

      Problem: in Claude Code installs, the main session (acting as @Main) was
      consistently skipping @CodeReviewer between @CodeWriter and the stage
      checkpoint. Observed pattern: @CodeWriter implements a stage → @Main reads
      a couple of changed files itself → marks "Stage N looks correct" → checkpoint.
      No independent review pass ever ran.

      Root cause: step 7's wording — `call superpowers:executing-plans. For each
      incomplete stage:` followed by sub-bullets a–h — read as "delegate to the
      external skill; sub-bullets are descriptive". superpowers:executing-plans does
      not include a code-review step, so @CodeReviewer fell off the loop. Combined
      with the main session's natural Read tool access, self-verification replaced
      the dispatch.

      Fix: rewrote step 7 in Main.body.md.template as an explicit MANDATORY loop
      (7.1–7.6) owned by @Main. superpowers:executing-plans is now described as
      an optional helper that does NOT replace the @CodeReviewer step. Added an
      anti-loop entry that flags the missing-reviewer state, and three new entries
      in "What NOT to do" forbidding self-verification, helper-delegation of the
      loop, and skipping the reviewer.

      No manifest changes. No host wrapper changes. Affects @Main behavior only.
    files_changed:
      - kit/_shared/agents/Main.body.md.template
    manifest_changes:
      added_fields: []

