versions:
  - version: "4.2.1"
    released: "2026-05-05"
    breaking: false
    description: |
      Fix several pre-existing pipeline step-number inconsistencies found during the
      v4.2.0 audit. No behavior changes — these are documentation/instruction fixes
      that prevent agents from following stale references.

      Specifically:
      - kit-approve.md said "FEATURE → step 6 EXECUTE" — corrected to step 7 (step 6
        is CONFIRM in Main FEATURE pipeline; EXECUTE is step 7).
      - Main TECH pipeline said "EXECUTE — same cycle as FEATURE step 6" — corrected
        to step 7 for the same reason.
      - Main AUTO_APPROVE retry instruction referenced "same write process as step 4"
        for plan-file edits — corrected to step 5 (step 4 is LOOKUP; PLAN is step 5).
      - _shared.md Flow B description claimed @Main "skips directly to step 3 (DESIGN)"
        after pre-made package detection — corrected to "skips REQUIREMENTS PHASE
        (step 1), proceeding to step 2 (SEARCH)" to match Main step 0.5.
      - session-handoff skill (introduced in 4.2.0) hard-coded "Proceed to step 6
        (CONFIRM)" — wrong for TECH where CONFIRM is step 3. Skill now defers to the
        calling step in Main for routing.
    files_changed:
      - kit/_shared/commands/kit-approve.md.template
      - kit/_shared/agents/Main.body.md.template
      - kit/_shared/_shared.md.template
      - kit/_shared/skills/session-handoff/SKILL.md.template
    manifest_changes:
      added_fields: []

  - version: "4.2.0"
    released: "2026-05-05"
    breaking: false
    description: |
      Add session-handoff skill for copy-pasteable resume context after planning.

      @Main now reads the session-handoff skill after completing the planning phase:
      - FEATURE pipeline: new step 5b after QA IMPL DRAFT (step 5a)
      - TECH pipeline: new step 2a after PLAN (step 2)

      The skill prints a bounded block listing every planning artifact path
      (task state, plan, all stage files, spec, test cases, requirements, corner cases)
      and the incomplete stage count, so the PO can either run /kit-resume in a new
      session or paste the block as manual context. The block is printed before CONFIRM
      and does not change pipeline flow.
    files_changed:
      - kit/_shared/skills/session-handoff/SKILL.md.template
      - kit/_shared/agents/Main.body.md.template
    manifest_changes:
      added_fields: []

  - version: "4.1.0"
    released: "2026-05-05"
    breaking: false
    description: |
      Add mermaid-validate skill for /kit-diagram rendering validation.

      @SystemAnalyst DIAGRAM mode now runs a new step 3.5 after writing the
      diagrams file: it reads the mermaid-validate skill and follows its
      instructions. If npm is available, mmdc (mermaid-cli via npx) renders
      every diagram block and reports pass/fail; on failure the agent fixes
      the block and re-tries once (removes it if still failing). If npm is
      unavailable, the skill falls back to an AI syntax self-check covering
      node IDs, arrow types, undeclared participants, and unclosed blocks.
      The result block gains a **Validation:** line in both cases.
    files_changed:
      - kit/_shared/skills/mermaid-validate/SKILL.md.template
      - kit/_shared/agents/SystemAnalyst.body.md.template
    manifest_changes:
      added_fields: []

  - version: "4.0.3"
    released: "2026-05-05"
    breaking: false
    description: |
      Fix naming inconsistency: rename debugger → Debugger to match PascalCase convention
      used by all other agents. Add missing .planning/bugs/.gitkeep so the directory is
      created on fresh installs (the Debugger agent writes BUG-NNN.md there).

      No manifest changes. Installed projects should re-run /kit-update to get the renamed
      agent files — existing @debugger dispatch calls in AUTO_MEMORY.md or task files will
      continue to resolve until updated at the next /kit-update.
    files_changed:
      - kit/.claude/agents/Debugger.md.template
      - kit/.opencode/agents/Debugger.md.template
      - kit/_shared/agents/Debugger.body.md.template
      - kit/CLAUDE.md.template
      - kit/_shared/_shared.md.template
      - kit/_shared/FILE_STRUCTURE.md.template
      - kit/_shared/commands/kit-fix.md.template
      - kit/_shared/agents/Main.body.md.template
      - kit/.planning/bugs/.gitkeep
    manifest_changes:
      added_fields: []

  - version: "4.0.2"
    released: "2026-05-05"
    breaking: false
    description: |
      Fix localization not working in Claude Code host.

      The i18n locale file (`.claude/i18n/<lang>.md`) was never loaded in
      Claude Code installs. OpenCode correctly listed it in `opencode.json`
      `instructions`, but the Claude Code `CLAUDE.md.template` had no
      corresponding `@`-import, and `_shared.md.template` described the
      mechanism as "loaded by this host's runtime" — which was simply wrong
      for Claude Code.

      Fix 1: `kit/CLAUDE.md.template` now begins with
        `@{{HOST_DIR}}/i18n/{{KIT_LANG}}.md`
      so the main (Orchestrator) session loads the locale file automatically.

      Fix 2: `kit/_shared/_shared.md.template` replaces the passive
      "is loaded by this host's runtime" with an explicit instruction for
      subagents to Read the locale file at the start of every task, matching
      what OpenCode already does via its `instructions` array.

      No manifest changes. Existing Claude Code installs should re-run
      `/kit-update` to get the updated `CLAUDE.md` with the `@`-import.
    files_changed:
      - kit/CLAUDE.md.template
      - kit/_shared/_shared.md.template
    manifest_changes:
      added_fields: []

  - version: "4.0.1"
    released: "2026-05-05"
    breaking: false
    description: |
      Fix YAML frontmatter for five OpenCode agent wrappers.

      The wrapper templates for `BugFixer`, `CodeWriter`, `Designer`,
      `PromptEngineer` and `debugger` started with a `# Tool categories ...`
      comment block BEFORE the opening `---` delimiter. Strict YAML
      frontmatter parsers expect `---` at byte 0, so these wrappers risked
      having their `description`, `mode`, `model`, `permission` block etc.
      silently ignored, falling back to defaults.

      The comments are preserved — moved INSIDE the frontmatter block where
      `#` is a valid YAML comment marker. Agent behaviour is unchanged; only
      the file layout becomes spec-compliant. The 10 wrappers that already
      began with `---` at byte 0, and all 14 Claude Code wrappers, were not
      affected.

      Also corrects two stale `# Tool categories (N specialized domains)`
      counts inside the comment block (`Designer`: 5→4, `debugger`: 4→2)
      so the declared number matches the listed items. Comment-only.

      No manifest changes. Existing installs do not need to re-run
      `/kit-update` for this fix unless they observed the symptom.
    files_changed:
      - kit/.opencode/agents/BugFixer.md.template
      - kit/.opencode/agents/CodeWriter.md.template
      - kit/.opencode/agents/Designer.md.template
      - kit/.opencode/agents/PromptEngineer.md.template
      - kit/.opencode/agents/debugger.md.template
    manifest_changes:
      added_fields: []

  - version: "4.0.0"
    released: "2026-05-05"
    breaking: true
    description: |
      **BREAKING: multi-host architecture — kit now renders per host (OpenCode and/or Claude Code).**

      Pre-v4 the kit only supported OpenCode. v4 introduces a new `host` axis with
      cardinality 1..N, allowing a project to run on OpenCode, Claude Code, or
      both side-by-side.

      **What changed in the manifest (BREAKING):**
        - `editors: [opencode]` → REMOVED. Replaced by `hosts: [opencode]` (or
          `[claude-code]`, or `[opencode, claude-code]`). `/kit-update` migrates
          pre-v4 manifests automatically (PHASE 2.5): `editors` is dropped, a
          `hosts` field with the same values is added, and the `opencode` host
          profile is appended to `stack.profiles[]`.
        - New top-level block `claude_code:` (required iff `claude-code` ∈ hosts):
          ```yaml
          claude_code:
            models:
              default: sonnet      # opus | sonnet | haiku | full ID
              coder: opus
              reviewer: opus
              designer: opus       # null to omit @Designer
              small: haiku
          ```
        - Existing top-level `provider:` and `models:` are now **conditionally
          required** — only when `opencode` ∈ hosts. Claude-Code-only installs
          use Anthropic native models (set in `claude_code.models`), so they
          do NOT need a provider/models block.
        - `host` axis profiles must be in `stack.profiles[]` to drive the
          rendering. After auto-migration this list contains `opencode`. Add
          `claude-code` via `/kit-extend
          https://github.com/aequicor/ai-agent-kit/blob/master/profiles/host/claude-code.yaml`
          (this also adds the `claude_code:` block — the prompt asks the
          per-host questions interactively).

      **What changed in the kit tree (BREAKING for forks/contributors):**
        - New shared root `kit/_shared/` — single source of truth for agent
          bodies (no frontmatter), commands, skills, i18n, sessions,
          `_shared.md`, `FILE_STRUCTURE.md`, `PROJECT_RULES.body.md`. Templates
          here are inlined via `{{INCLUDE: <path>}}` directives at install time.
        - `kit/.opencode/` now contains ONLY agent wrappers (frontmatter +
          INCLUDE). All commands, skills, i18n, sessions, `_shared.md`,
          `FILE_STRUCTURE.md` moved to `kit/_shared/`.
        - New `kit/.claude/` tree with 14 agent wrappers (no `Main.md` — the
          orchestrator content is inlined into `kit/CLAUDE.md.template` because
          Claude Code's main session IS the orchestrator) and
          `settings.json.template`.
        - `kit/CLAUDE.md.template` (new): rendered iff `claude-code` ∈ hosts,
          inlines `_shared/PROJECT_RULES.body.md.template` + the orchestrator
          body via INCLUDE.
        - `kit/AGENTS.md.template` is now a thin wrapper that includes
          `_shared/PROJECT_RULES.body.md.template`.
        - `kit/nested/AGENTS.md.nested.template` renamed to
          `kit/nested/MODULE.body.md.template` — same content, used to render
          `<source_root>/AGENTS.md` (opencode host) AND
          `<source_root>/CLAUDE.md` (claude-code host) per module.
        - `kit/editors/opencode/CLAUDE.md.template` REMOVED (legacy bridge —
          replaced by the proper `kit/CLAUDE.md.template`).

      **New install-time mechanic — INCLUDE resolution:**
        - Templates may reference `{{INCLUDE: <relative-path-inside-kit>}}`.
        - The setup/update/extend prompts recursively resolve these (max depth
          5, path-escape guarded) BEFORE `{{VAR}}` substitution. This is what
          lets a single agent body live in `_shared/agents/<Name>.body.md.template`
          and be wrapped by both OpenCode and Claude Code frontmatter.

      **Per-host substitution placeholders (used inside `_shared/` content):**
        - `{{HOST_DIR}}` → `.opencode` or `.claude`
        - `{{HOST_NAME}}` → `OpenCode` or `Claude Code`
        - `{{HOST_INSTRUCTION_FILE}}` → `AGENTS.md` or `CLAUDE.md`
        - `{{HOST_CONFIG_FILE}}` → `opencode.json` or `.claude/settings.json`
        - `{{KIT_LANG_ENV}}` → `OPENCODE_LANG` or `KIT_LANG`
        - `{{DISPATCH_TOOL}}` → `` `task` `` (OpenCode) or `the Agent tool` (Claude Code)
        - Model placeholders (`{{DEFAULT_MODEL}}`, `{{CODER_MODEL}}`, etc.)
          resolve to `models.*` for OpenCode and `claude_code.models.*` for
          Claude Code.

      **Migration steps for an installed pre-v4 project:**
        1. Run `/kit-update`. It detects `kit_version < 4.0.0`, replaces
           `editors:` with `hosts:`, appends `opencode` to
           `stack.profiles[]`, then re-renders into the existing `.opencode/`
           tree with the new INCLUDE-based wrappers. The behaviour is
           equivalent to pre-v4 — no Claude Code is installed yet.
        2. (Optional) To add Claude Code to the same project, run:
           ```
           /kit-extend https://github.com/aequicor/ai-agent-kit/blob/master/profiles/host/claude-code.yaml
           ```
           The extend prompt asks Q17a–Q17e (Claude Code model assignments),
           writes `claude_code.models` to the manifest, and renders the
           `.claude/` tree alongside the existing `.opencode/`.

      **Why this matters:**
        - Projects with mixed engineering teams (some on OpenCode, others on
          Claude Code) can share the same kit, the same agent prompts, the
          same workflows.
        - Single agent prose source means a fix to e.g. `@CodeWriter`
          instructions lands in both runtimes simultaneously.
    files_changed:
