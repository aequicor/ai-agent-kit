  - version: "4.0.0"
    released: "2026-05-05"
    breaking: true
    description: |
      **BREAKING: multi-host architecture — kit now renders per host (OpenCode and/or Claude Code).**

      Pre-v4 the kit only supported OpenCode. v4 introduces a new `host` axis with
      cardinality 1..N, allowing a project to run on OpenCode, Claude Code, or
      both side-by-side.

      **What changed in the manifest (BREAKING):**
        - `editors: [opencode]` → REMOVED. Replaced by `hosts: [opencode]` (or
          `[claude-code]`, or `[opencode, claude-code]`). `/kit-update` migrates
          pre-v4 manifests automatically (PHASE 2.5): `editors` is dropped, a
          `hosts` field with the same values is added, and the `opencode` host
          profile is appended to `stack.profiles[]`.
        - New top-level block `claude_code:` (required iff `claude-code` ∈ hosts):
          ```yaml
          claude_code:
            models:
              default: sonnet      # opus | sonnet | haiku | full ID
              coder: opus
              reviewer: opus
              designer: opus       # null to omit @Designer
              small: haiku
          ```
        - Existing top-level `provider:` and `models:` are now **conditionally
          required** — only when `opencode` ∈ hosts. Claude-Code-only installs
          use Anthropic native models (set in `claude_code.models`), so they
          do NOT need a provider/models block.
        - `host` axis profiles must be in `stack.profiles[]` to drive the
          rendering. After auto-migration this list contains `opencode`. Add
          `claude-code` via `/kit-extend
          https://github.com/aequicor/ai-agent-kit/blob/master/profiles/host/claude-code.yaml`
          (this also adds the `claude_code:` block — the prompt asks the
          per-host questions interactively).

      **What changed in the kit tree (BREAKING for forks/contributors):**
        - New shared root `kit/_shared/` — single source of truth for agent
          bodies (no frontmatter), commands, skills, i18n, sessions,
          `_shared.md`, `FILE_STRUCTURE.md`, `PROJECT_RULES.body.md`. Templates
          here are inlined via `{{INCLUDE: <path>}}` directives at install time.
        - `kit/.opencode/` now contains ONLY agent wrappers (frontmatter +
          INCLUDE). All commands, skills, i18n, sessions, `_shared.md`,
          `FILE_STRUCTURE.md` moved to `kit/_shared/`.
        - New `kit/.claude/` tree with 14 agent wrappers (no `Main.md` — the
          orchestrator content is inlined into `kit/CLAUDE.md.template` because
          Claude Code's main session IS the orchestrator) and
          `settings.json.template`.
        - `kit/CLAUDE.md.template` (new): rendered iff `claude-code` ∈ hosts,
          inlines `_shared/PROJECT_RULES.body.md.template` + the orchestrator
          body via INCLUDE.
        - `kit/AGENTS.md.template` is now a thin wrapper that includes
          `_shared/PROJECT_RULES.body.md.template`.
        - `kit/nested/AGENTS.md.nested.template` renamed to
          `kit/nested/MODULE.body.md.template` — same content, used to render
          `<source_root>/AGENTS.md` (opencode host) AND
          `<source_root>/CLAUDE.md` (claude-code host) per module.
        - `kit/editors/opencode/CLAUDE.md.template` REMOVED (legacy bridge —
          replaced by the proper `kit/CLAUDE.md.template`).

      **New install-time mechanic — INCLUDE resolution:**
        - Templates may reference `{{INCLUDE: <relative-path-inside-kit>}}`.
        - The setup/update/extend prompts recursively resolve these (max depth
          5, path-escape guarded) BEFORE `{{VAR}}` substitution. This is what
          lets a single agent body live in `_shared/agents/<Name>.body.md.template`
          and be wrapped by both OpenCode and Claude Code frontmatter.

      **Per-host substitution placeholders (used inside `_shared/` content):**
        - `{{HOST_DIR}}` → `.opencode` or `.claude`
        - `{{HOST_NAME}}` → `OpenCode` or `Claude Code`
        - `{{HOST_INSTRUCTION_FILE}}` → `AGENTS.md` or `CLAUDE.md`
        - `{{HOST_CONFIG_FILE}}` → `opencode.json` or `.claude/settings.json`
        - `{{KIT_LANG_ENV}}` → `OPENCODE_LANG` or `KIT_LANG`
        - `{{DISPATCH_TOOL}}` → `` `task` `` (OpenCode) or `the Agent tool` (Claude Code)
        - Model placeholders (`{{DEFAULT_MODEL}}`, `{{CODER_MODEL}}`, etc.)
          resolve to `models.*` for OpenCode and `claude_code.models.*` for
          Claude Code.

      **Migration steps for an installed pre-v4 project:**
        1. Run `/kit-update`. It detects `kit_version < 4.0.0`, replaces
           `editors:` with `hosts:`, appends `opencode` to
           `stack.profiles[]`, then re-renders into the existing `.opencode/`
           tree with the new INCLUDE-based wrappers. The behaviour is
           equivalent to pre-v4 — no Claude Code is installed yet.
        2. (Optional) To add Claude Code to the same project, run:
           ```
           /kit-extend https://github.com/aequicor/ai-agent-kit/blob/master/profiles/host/claude-code.yaml
           ```
           The extend prompt asks Q17a–Q17e (Claude Code model assignments),
           writes `claude_code.models` to the manifest, and renders the
           `.claude/` tree alongside the existing `.opencode/`.

      **Why this matters:**
        - Projects with mixed engineering teams (some on OpenCode, others on
          Claude Code) can share the same kit, the same agent prompts, the
          same workflows.
        - Single agent prose source means a fix to e.g. `@CodeWriter`
          instructions lands in both runtimes simultaneously.
    files_changed:
      - kit/_shared/_shared.md.template
      - kit/_shared/FILE_STRUCTURE.md.template
