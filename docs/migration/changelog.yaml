        /update               → /kit-update
        /update-deps          → /kit-update-deps
        /approve-with-conflicts → /kit-approve-with-conflicts

      All cross-references in agents, skills, templates, vault templates,
      i18n files, the setup prompt, and the README have been updated to use
      the new names.

      **MIGRATION FROM 2.x:**

      1. From within an installed 2.x kit, the old `/update` command no
         longer exists in this release of the source repo, so paste the
         update prompt directly to start the upgrade:

             Fetch and follow:
               https://raw.githubusercontent.com/aequicor/ai-agent-kit/master/docs/prompts/update.md

         (Once the update completes, you'll have `/kit-update` available
         for future upgrades.)

      2. **Manual cleanup after update** — the update flow writes the new
         `kit-*.md` files but does not automatically delete the old
         unprefixed files. After the update completes, delete the orphan
         command files in your project:

             rm .opencode/commands/{approve,checkpoint,deploy,diagram,fix,lint,new-feature,requirements-pipeline,resume,review,status,uninstall,update,update-deps}.md

         (Skip files that don't exist — earlier kit versions had a smaller
         command set.)

      3. Update any project-local docs, READMEs, or onboarding notes that
         reference the old command names.

      No manifest field changes. `kit_version` simply moves 2.4.0 → 3.0.0.
