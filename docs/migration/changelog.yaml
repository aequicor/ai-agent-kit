      *before* any other Q&A. The question itself is bilingual (English /
      Русский) because at that point the agent does not yet know PO's
      language. The chosen code (`en` / `ru`) is stored as `Q0_ANSWER` and
      becomes binding: every PHASE 1 question, every PHASE 2/3/4 status line,
      every error, every confirmation, and the PHASE 5 summary must be
      rendered in that language. The same value is still mapped to
      `manifest.language_code` in PHASE 2.2, so installed agents keep the
      locale they were configured with — no schema change.

      Translation discipline is explicit in the prompt: technical tokens
      (manifest keys, profile names, axis names, command names, file paths,
      env-var names, model IDs, regex patterns) stay in English; only the
      natural-language wrapping around them is translated. Code blocks, YAML
      samples, and schema fragments are not translated.

      Prior behaviour shipped Q0 as the first item inside PHASE 1, and the
      install conversation always ran in English regardless of the answer —
      Russian-speaking POs had to mentally translate the questions even after
      asking for `ru`. This release fixes that asymmetry.

      Backward-compatible: no manifest, schema, or `kit/` file changed; the
      only edit is to `docs/prompts/setup.md`.
    files_changed: []
    manifest_changes:
      added_fields: []

  - version: "4.7.0"
    released: "2026-05-07"
    breaking: false
    description: |
      New `clean-architecture` capability profile — system-level layering
      enforcement that complements the existing class-level `solid` profile.

      The `solid` profile previously bundled four light Clean-Architecture
      layer-boundary patterns under a "SOLID & Clean Architecture" header,
      but those patterns covered only the most obvious mistakes (presentation
      with business rules, framework-annotated entities, infrastructure with
      decisions, wrong-direction imports). Real CA enforcement needs deeper
      checks for the dependency rule, ports-and-adapters placement, boundary
      DTOs, composition-root wiring, screaming architecture, and testability
      through ports.

      This release adds a dedicated `clean-architecture` profile with ~30
      forbidden patterns covering:

        - The Dependency Rule (inward-only imports, framework-free inner layers)
        - Entities (no ORM/serialization/DI annotations, no anemic domains)
        - Use Cases / Interactors (single business operation, no cross-cutting
          inline, no entity leakage to presenters)
        - Ports & Adapters (ports declared with the consumer, not the
          implementer; signatures expressed in domain types)
        - Boundary crossing (DTOs not entities; persistence-model isolation)
        - Composition Root (DI/wiring at the edge, not in inner layers)
        - Screaming Architecture (package structure reflects the domain)
        - Testability (use-cases run without infrastructure; entities run
          without a framework runtime)

      The `solid` profile keeps its existing patterns unchanged (no behavior
      regression for projects already on it) — its header just clarifies
      that CA depth lives in the new profile. There is a small overlap on
      layer-boundary patterns; setup.md merges `forbidden_patterns` by
      concat + dedupe, so duplicates between the two profiles are harmless.

      No schema changes, no new manifest fields, no `_index.txt` change
      (profiles live outside `kit/`). Backward-compatible: existing
      manifests are unaffected. Opt in by adding `clean-architecture` to
      `stack.profiles[]` (or via `/kit-extend` / `/kit-config`).
    files_changed:
      - profiles/capability/clean-architecture.yaml
      - profiles/capability/solid.yaml
    manifest_changes:
      added_fields: []

  - version: "4.6.2"
    released: "2026-05-06"
    breaking: false
    description: |
      Stub & deferral gate — three layered prompt edits that close a silent
      failure path where `@CodeWriter` could leave `// TODO` bodies in
      production code, `@TestExecutor` would pass tests written against the
      empty bodies, `@CodeReviewer` had no rule against it, and the per-stage
      checkpoint would assert the AC was implemented.

      The end-of-feature gates (`@CornerCaseReviewer IMPL`,
      `@TraceabilityChecker`, `@DoDGate`) eventually catch the gap, but by
      that time several subsequent stages have been built atop the
      false-positive assertion, multiplying rework. The kit's `CLAUDE.md`
      already declared `TODO`/`FIXME` in production code without a tracking
      entry forbidden — but no agent enforced it.

      Three layered fixes (defense in depth):

        - kit/_shared/agents/CodeReviewer.body.md.template — new focus area 6
          "Stub & deferral check (CRITICAL)". Reviewer scans every changeset
          file for `TODO|FIXME|XXX|HACK|stage [0-9]|later|TBD` and
          flags unpaired hits in production code as CRITICAL. New "DO NOT"
          line forbids downgrading in-changeset hits to MEDIUM/LOW or to
          tech-debt — tech-debt entries are for markers in files outside
          the changeset.
        - kit/_shared/agents/Main.body.md.template — new step 7.3c STUB-SCAN
          between 7.3 (REVIEW) and 7.4 (FIX). Mechanical grep over the
          changed-files list. Folds unpaired hits into the review findings
          as CRITICAL. Backstop in case `@CodeReviewer`'s prose-based check
          drifts. Step 7.4 FIX now consumes the union of (CodeReviewer,
          SecurityReviewer, STUB-SCAN) findings.
        - kit/_shared/agents/CodeWriter.body.md.template — new Step 3a
          "Stage Atomicity (no stubs)" with explicit BLOCKED return contract.
          When a method cannot be fully implemented in the current stage,
          CodeWriter returns BLOCKED (replacing the normal "Changed Files"
          table) instead of committing a `// TODO` body. The existing
          one-line "DO NOT leave unimplemented stubs" rule was buried in a
          12-item DO NOT list; it now references Step 3a explicitly.

      Also: kit/_shared/skills/code-review-checklist/SKILL.md.template —
      new "Stub & Deferral Check (CRITICAL — blocking)" subsection mirrors
      the new CodeReviewer rule as four binary checkboxes. Same surface,
      two consumers (the agent body and the skill); if either drifts the
      other still enforces.

      No new files, no schema changes, no profile changes, no `_index.txt`
      change. Existing installs pick up the new rules on next `/kit-update`.
    files_changed:
      - kit/_shared/agents/CodeReviewer.body.md.template
      - kit/_shared/agents/Main.body.md.template
      - kit/_shared/agents/CodeWriter.body.md.template
      - kit/_shared/skills/code-review-checklist/SKILL.md.template
    manifest_changes:
      added_fields: []

  - version: "4.6.1"
    released: "2026-05-06"
    breaking: false
    description: |
      Tool Use Discipline — prompt-level guardrails for three recurring
      tool-call failures that have been burning context across all agents:

        1. "File has not been read yet. Read it first before writing to it."
           — `edit` (and `write` to existing files) called before a `read` of
             the same path in the current session.
        2. "newString equals oldString" — `edit` submitted with an identical
             `old_string` and `new_string` (no-op diff).
        3. Path mismatch — agent uses an absolute path copied from
             `AUTO_MEMORY.md`, vault docs, or a prior session that belongs to
             a different OS / developer's checkout (e.g. `/home/user/...`
             while CWD is `C:\Users\...`).

      Each error wastes a full tool round-trip and forces the model to
      recover, polluting context. The kit had no explicit rule against any
      of them.

      Fix — three independent edits, all prompt-only (no new files, no
      manifest changes, no profile changes):

        - `kit/_shared/_shared.md.template` — adds a new "Tool Use
          Discipline" section right after "Reasoning Loop". Full rules for
          all three failure modes plus a 3-line pre-flight checklist. This
          file is loaded as a top-level instruction by OpenCode and is
          referenced by every subagent body on both hosts, so the rules
          reach all agents that perform file edits.
        - `kit/_shared/PROJECT_RULES.body.md.template` — adds a compact
          "Tool Use Discipline" subsection (3 bullets, ~7 lines) between
          "Boundaries" and "Corner Cases". This file is `{{INCLUDE}}`d
          into both `CLAUDE.md` (Claude Code) and `AGENTS.md` (OpenCode),
          so the orchestrator main session sees the rules without having
          to read `_shared.md` mid-task. References `_shared.md` for the
          full text.
        - `kit/AUTO_MEMORY.md.template` — header-level reminder that any
          file path written to AUTO_MEMORY must be project-relative, not
          absolute. Closes the feedback loop where one agent records an
          absolute path and a future agent on a different machine
          dereferences it verbatim.

      No new files, no schema changes, no profile changes. Existing
      installs pick up the new rules on next `/kit-update`.
    files_changed:
      - kit/_shared/_shared.md.template
      - kit/_shared/PROJECT_RULES.body.md.template
      - kit/AUTO_MEMORY.md.template
    manifest_changes:
      added_fields: []

  - version: "4.6.0"
    released: "2026-05-06"
    breaking: false
    description: |
      New command `/kit-config` — edit installed manifest in plain language.

      Problem: changing models, provider, MCP toggles, language, modules,
      formatter, lsp, ui, or code-quality patterns in an installed kit
      previously required either editing the manifest YAML by hand and
      re-running `setup.md` (heavy, full re-render), or directly editing
      the rendered host configs (`opencode.json`, `.claude/settings.json`)
      and risking drift with the manifest. There was no targeted, intent-
      driven reconfigure path.

      Fix: a new command `/kit-config <plain-language description>` (or
      `/kit-config` for interactive mode) that:
        - locates the project manifest;
        - parses the PO's free-form request (any natural language) into
          field-level edits;
        - asks one clarifying question if ambiguous;
        - refuses and redirects edits to `kit_version` (use `/kit-update`),
          `hosts` and `stack.profiles[]` (use `/kit-extend`);
        - schema-validates every edit and security-scans every
          `*api_key_env` change for literal-key patterns;
        - classifies blast radius (LOW / MEDIUM / HIGH) and shows the
          unified manifest diff + the file re-render set + warnings
          for HIGH-blast changes (`vault_path`, `modules[]` rename,
          `project.name`);
        - waits for `/kit-approve` (or `@AutoApprover` if `AUTO_APPROVE=true`);
        - writes the manifest, re-renders only the affected files in merge
          mode (same skip-list as `/kit-update`);
        - re-validates manifest + every host config (`opencode.json` /
          `.claude/settings.json`); surfaces failures with file paths
          and lets PO decide.

      No new manifest fields. No changes to existing pipelines, agents, or
      skills. The command is host-agnostic — single source under
      `kit/_shared/commands/`, rendered into every host's `commands/`.

      Examples:
        /kit-config switch the reviewer model to claude-opus-4-7
        /kit-config выключи MCP serena, он больше не нужен
        /kit-config поменяй провайдера на ollama-cloud, ключ в OLLAMA_KEY
        /kit-config add a forbidden pattern: no var declarations in Kotlin
        /kit-config rename module server to backend
        /kit-config                    # interactive picker
    files_changed:
      - kit/_shared/commands/kit-config.md.template
      - kit/_index.txt
    manifest_changes:
      added_fields: []

  - version: "4.5.1"
    released: "2026-05-06"
    breaking: false
    description: |
      Pipeline wall-time optimization — three independent reviewers/checkers
      now dispatched in parallel where they share inputs and write nothing.

      Problem: the v4.5 quality-gates pipeline serialized every reviewer
      dispatch even when reviewers had no shared output, inflating wall time
      on every stage and on every feature close-out. Independent verifiers
      (CodeReviewer, SecurityReviewer, TraceabilityChecker, CornerCaseReviewer
      IMPLEMENTATION) emit verdicts but do not modify shared files, so they
      can run concurrently without affecting correctness.

      Three changes — all behavior-preserving, all backward-compatible:

      1. EXECUTE step 7 — `@CodeReviewer` and `@SecurityReviewer` are now
         dispatched **in one turn as parallel calls** (Main step 7.3, was
         7.3a then 7.3b sequential). `@SecurityReviewer` still gates on the
         security-surface trigger list; if `@CodeReviewer` later flags a
         `(deferred to @SecurityReviewer)` smell that the surface check
         missed, `@SecurityReviewer` is dispatched as a sequential follow-up.
         Anti-Loop and DoDGate Group 4.2 logic unchanged.

      2. Post-implementation checks — `@CornerCaseReviewer` (Mode=IMPLEMENTATION)
         and `@TraceabilityChecker` are now dispatched **in parallel** after
         `@QA IMPL FINAL` completes (Main steps 7b ‖ 7c, was 7b → 7c
         sequential). Both are read-only verifiers over the same post-FINAL
         artifacts; cycle counters tracked independently per check.

      3. Requirements pipeline — `@CoverageChecker` (iteration 1) and
         `@SystemAnalyst DRAFT` are now dispatched **in parallel** at the
         start of step 4/5 (skill: requirements-pipeline). Both consume
         requirements + corner-case register (frozen by step 2.5); SA reads
         test-cases as informational input but its spec content derives from
         requirements + CCs. Coverage FIX iterations remain sequential within
         step 4 if needed.

      No new agents, skills, commands, or manifest fields. No changes to
      verdict semantics, retry caps, or DoD gate logic. Existing Anti-Loop
      rules apply unchanged. Step renaming (7.3a + 7.3b → 7.3) is internal
      doc reference only — DoDGate, SecurityReviewer, and the cross-reference
      in definition-of-done skill updated accordingly.
    files_changed:
      - kit/_shared/agents/Main.body.md.template
      - kit/_shared/agents/SecurityReviewer.body.md.template
      - kit/_shared/skills/definition-of-done/SKILL.md.template
      - kit/_shared/skills/requirements-pipeline/SKILL.md.template
    manifest_changes:
      added_fields: []

  - version: "4.5.0"
    released: "2026-05-06"
    breaking: false
    description: |
      Quality-gates pipeline — independent test execution, traceability,
      Definition-of-Done, split security review, IMPLEMENTATION-mode corner-case
      attack, TDD-first CodeWriter, mandatory bug-retro for CRIT/HIGH defects.

      Problem: the v4.4 pipeline produced excellent paperwork (requirements,
      corner-case register, test-cases.md, spec, stage files) and conducted
      strong document-level review (CCR×2 + CoverageChecker + ConsistencyChecker)
      but the execution side had only one writer (CodeWriter) and one read-only
      reviewer (CodeReviewer). Defects leaked through despite all the planning
      because:
        1. "Build green" was self-graded by CodeWriter, never independently rerun.
        2. There was no spec ↔ code traceability gate — Critical CCs could quietly
           drop out of implementation.
        3. CornerCaseReviewer attacked documents only, never the code.
        4. CodeReviewer's security focus area was crowded out by style/structure
           feedback on large diffs.
        5. CodeWriter wrote tests after code — tests rationalized the code that
           existed instead of describing the contract first.
        6. There was no Definition-of-Done gate before CLOSE — features closed
           on prose checkpoints, not machine-checkable assertions.
        7. bug-retro was opt-in even for CRITICAL/HIGH defects — systemic
           prevention loop was weak.

      Fix: four new agents, three new skills, six existing agents/skills updated,
      one new capability profile, and a rewritten Main FEATURE/TECH/BUG pipeline.

      Pipeline changes (Main FEATURE):

        Old:  PLAN -> CONFIRM -> EXECUTE(CodeWriter -> CodeReviewer -> fix) ->
              QA IMPL FINAL -> optional walkthrough -> CLOSE
        New:  PLAN -> pre-mortem (5b) -> CONFIRM ->
              EXECUTE(CodeWriter -> TestExecutor -> TestRunner AUTO_VERIFY ->
                      CodeReviewer -> SecurityReviewer conditional -> fix) ->
              QA IMPL FINAL -> CornerCaseReviewer IMPLEMENTATION (7b) ->
              TraceabilityChecker (7c) -> WALKTHROUGH (conditional-mandatory
              if any manual-type TC is PEND) -> DoDGate (7e — mandatory binary
              gate before CLOSE) -> CLOSE.

      New agents (4) — body + opencode wrapper + claude wrapper for each:

        - @TestExecutor — independent build + unit + integration test runner
          after CodeWriter, before CodeReviewer. Maps in-scope TCs to
          PASS / FAIL / NOT_RUN. Verdicts: ALL_GREEN | FAILURES | NOT_RUN_GAP
          | BUILD_FAIL. Read-only on src/. Writes the run report to
          {{VAULT_PATH}}/guidelines/<module>/reports/test-runs/.

        - @TraceabilityChecker — read-only audit linking AC / CC / spec endpoints
          -> TC -> test file -> source symbol. Reports orphans both directions
          plus WEAK_ASSERTION flags on Critical/High coverage. Writes
          <feature>-trace.md to spec dir.

        - @DoDGate — last gate before CLOSE. Reads the definition-of-done skill
          (8 groups, ~25 binary checks) over every artifact + last test run +
          last reviews. Returns binary PASS / BLOCK. PO override path is
          /kit-approve-with-dod-waiver and waives only UNVERIFIED rows; a
          FAIL row cannot be waived. Writes <feature>-dod.md to spec dir.

        - @SecurityReviewer — adversarial OWASP-aligned pass after CodeReviewer
          for stages whose changeset touches a security surface (auth, sessions,
          tokens, PII, payments, file uploads, deserialization, SQL/ORM,
          external HTTP, RBAC). Read-only on src/.

      New skills (3):

        - definition-of-done — canonical DoD checklist read by @DoDGate. 8
          groups: test cases / test run / trace / reviews / build & lint /
          coverage / open questions / plan. Each row binary, evidence required.
          PO waiver via dod_waiver: lines (UNVERIFIED only).

        - pre-mortem — lightweight 8-lens pre-execute risk pass run by @Main
          between PLAN and CONFIRM. Risks table appended to plan file.

        - spec-to-code-trace — heuristics + conventions for the trace chain.
          Tag prefixes ([AC-N], [CC-N <Sev>], [spec], [premortem-R<N>]),
          (impl: <path>) notation, endpoint-to-handler patterns per framework,
          weak-assertion criterion. Single source of truth.

      Updated agents / skills (7):

        - CornerCaseReviewer.body — added IMPLEMENTATION mode. Attacks the
          code (not docs): per-CC verdicts HANDLED | MISSING_BRANCH |
          UNTESTED_BRANCH | WRONG_BEHAVIOR | DEFERRED.
        - CodeWriter.body — TDD-first ordering. Step 2 "Failing Tests First"
          before Step 3 "Write Code". What-NOT-to-do forbids vacuous assertions
          and pre-test production code.
        - CodeReviewer.body — security focus area reduced to surface-level
          smells with `(deferred to @SecurityReviewer)` note. Scope-split table
          with @SecurityReviewer in role section.
        - TestRunner.body — added AUTO_VERIFY mode (5th mode alongside SCAN /
          EXECUTE / RERUN / APPEND). Non-interactive bulk Status update from
          @TestExecutor's per-TC mapping after step 7.2a — closes the gap
          where TCs would stay PEND despite independent test verification and
          @DoDGate Group 1.1 would always block. Manual-type TCs are excluded
          (they require interactive walkthrough).
        - bug-retro skill — auto-trigger rules. Mandatory for CRITICAL/HIGH
          defects (Defects-log severity at fix time).
        - Main.body — FEATURE/TECH/BUG pipelines rewritten end-to-end.
          Anti-Loop, What-NOT-to-do extended. Step 7d WALKTHROUGH is now
          conditional-mandatory: skippable only when zero manual-type TCs
          remain in PEND status; otherwise PO must walk through them or add
          a per-TC dod_waiver line.
        - _shared.md.template + FILE_STRUCTURE.md.template — workflow tree,
          File Access Matrix, vault tree, system paths, and built-in skills
          list updated.

      New capability profile (1):

        - profiles/capability/quality-gates.yaml — language-agnostic
          forbidden_patterns covering vacuous assertions, untraceable tests,
          hidden skips, untested branches on Critical/High CCs, TDD bypasses,
          flakiness, test-data smells, and DoD-gate bypass attempts. Opt-in
          via stack.profiles.

      Backward compatibility: no manifest schema change. Existing pipelines
      continue to work — the new gates add MANDATORY steps. New PO override
      path /kit-approve-with-dod-waiver waives only UNVERIFIED DoD rows when
      tooling is missing (e.g. no coverage tool configured).
    files_changed:
      - kit/.claude/agents/DoDGate.md.template
      - kit/.claude/agents/SecurityReviewer.md.template
      - kit/.claude/agents/TestExecutor.md.template
      - kit/.claude/agents/TraceabilityChecker.md.template
      - kit/.opencode/agents/DoDGate.md.template
      - kit/.opencode/agents/SecurityReviewer.md.template
      - kit/.opencode/agents/TestExecutor.md.template
      - kit/.opencode/agents/TraceabilityChecker.md.template
      - kit/_index.txt
      - kit/_shared/FILE_STRUCTURE.md.template
      - kit/_shared/_shared.md.template
      - kit/_shared/agents/CodeReviewer.body.md.template
      - kit/_shared/agents/CodeWriter.body.md.template
      - kit/_shared/agents/CornerCaseReviewer.body.md.template
      - kit/_shared/agents/DoDGate.body.md.template
      - kit/_shared/agents/Main.body.md.template
      - kit/_shared/agents/SecurityReviewer.body.md.template
      - kit/_shared/agents/TestExecutor.body.md.template
      - kit/_shared/agents/TestRunner.body.md.template
      - kit/_shared/agents/TraceabilityChecker.body.md.template
      - kit/_shared/skills/bug-retro/SKILL.md.template
      - kit/_shared/skills/definition-of-done/SKILL.md.template
      - kit/_shared/skills/pre-mortem/SKILL.md.template
      - kit/_shared/skills/spec-to-code-trace/SKILL.md.template
      - profiles/capability/quality-gates.yaml
    manifest_changes:
      added_fields: []

  - version: "4.4.0"
    released: "2026-05-06"
    breaking: false
    description: |
      Add a tech-debt capture-and-fix loop.

      Problem: agents (CodeWriter, BugFixer, CodeReviewer) routinely notice
      non-critical issues outside the scope of the current task — compiler
      warnings, duplicated blocks in sibling files, deprecated calls, stale
      TODOs. Until now they had no recording surface short of escalation,
      so most of these findings were silently dropped. The few that were
      raised expanded the current diff or distracted PO mid-task.

      Fix: a per-module tech-debt folder in the vault plus a batch-fix
      command.

        - New skill `tech-debt-record` (kit/_shared/skills/tech-debt-record/
          SKILL.md.template) — defines exactly what to record (warning,
          duplication, smell, complexity, deprecation, todo) vs. what to
          fix or escalate (bugs, security, in-scope issues). Caps per
          task: 5 entries from CodeWriter / CodeReviewer, 3 from BugFixer.
        - New template kit/.vault/_templates/tech-debt.md — frontmatter
          (category, severity, status, module, files, discovered_by) +
          required body sections (Files, Description, Why not critical now,
          optional Suggested fix, Resolution).
        - Storage layout: {{VAULT_PATH}}/tech-debt/<module>/<slug>.md for
          open / in-progress entries; <module>/done/<slug>.md for archived.
        - New command `/kit-techdebt` (kit/_shared/commands/
          kit-techdebt.md.template) — SCAN with optional filter (TD-id,
          module=name, severity=high, free-form substring) → TRIAGE with PO
          → batch task file under .planning/tasks/techdebt-batch-<ISO>.md →
          per-entry classification (DIRECT for low/medium ≤2 files, PLAN
          for high / cross-cutting / ≥3 files) → fix loop reusing
          @CodeWriter/@CodeReviewer and @BugFixer-style cycles → ARCHIVE
          to done/ on success → REPORT.
        - Carve-out for @CodeReviewer: previously read-only on all files,
          now permitted to write tech-debt entries (analytical artifact,
          not source code). The role line and What-NOT-to-do list updated
          to reflect this. CRITICAL/HIGH issues never become tech-debt —
          they stay in the review and block the verdict.
        - File-access matrix and FILE_STRUCTURE.md updated with the new
          path and writers. Vault _INDEX.md updated with tech-debt/<module>/
          row in the per-module layout. _shared.md genre table gained a
          tech-debt row.
        - i18n: tech_debt and record_tech_debt action labels added in
          en.md and ru.md; /kit-techdebt added to commands list.
        - @Main body gained a brief TECHDEBT pipeline block referencing
          the command for the full step-by-step process.

      No manifest schema change — backward-compatible. Existing manifests
      will gain the new command and skill on `/kit-update`.
    files_changed:
      - kit/.vault/_INDEX.md.template
      - kit/.vault/_templates/tech-debt.md
      - kit/_index.txt
      - kit/_shared/FILE_STRUCTURE.md.template
      - kit/_shared/_shared.md.template
