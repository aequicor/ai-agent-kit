    manifest_changes:
      added_fields:
        - path: "hosts"
          default: [opencode]
          description: "Runtime hosts list (1..N). Replaces the pre-v4 `editors:` field. Allowed values: opencode, claude-code."
        - path: "claude_code"
          default: null
          description: "Claude Code config block. Required iff claude-code ∈ hosts. Contains `models` map with default/coder/reviewer/designer/small role assignments. Omit when only opencode is in hosts."
      profile_transforms:
