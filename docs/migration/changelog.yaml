          ci-github workflow added)
        - manifest.example.yaml (kit_version, slice_caps, test_strategy,
          ci_host, ci-github profile entry)

      ## Migration from v5.x

      `/kit-update` from v5.x to v6.0.0:

      1. Adds the new manifest fields with documented defaults
         (slice_caps, test_strategy=tdd_first, ci_host=none).
      2. Adds the `auto_approve.diff_review: false` key if `auto_approve` is
         in object form; if it is the boolean form, it stays as-is and
         diff_review defaults to false (NOT inherited from boolean).
      3. For each existing `vault/features/<module>/<feature>/feature.md`:
         splits into `spec.md` (Why, ACs, ECs, How it works, Test plan, UI
         sections) + `plan.md` (Implementation plan, DoD, plus the new empty
         Slice budget / Replan log / Step-level diff stats / Diff-review
         sections from the v6 plan.md skeleton). Existing REPLAN-N markers in
         the old § Implementation plan are preserved into plan.md. The original
         feature.md is removed (preserved by git history).
      4. Re-renders all kit-managed agent / skill / command / template files.
      5. Bumps kit_version to 6.0.0.

      Existing tasks mid-flight: PO should let them complete on v5.x semantics
      (re-render kit files only; do not split feature.md mid-flight). Run
      /kit-update only between tasks.

      ## What is NOT changing

      - Agent set (still 9: Analyst, CodeWriter, TestKeeper, Reviewer,
        TraceabilityChecker, DoDGate, BugFixer, Designer, plus @Main as
        orchestrator).
      - Definition of Done check count (still 7).
      - Pipeline phase count (FEATURE still has 6 phases: CLASSIFY → ANALYSIS
        → PLAN → CONFIRM → EXECUTE → CLOSE; EXECUTE adds two intra-phase
        steps 5.4a and 5.10 but the phase numbering is unchanged).
      - test-cases.md format and lifecycle (unchanged from v5).
      - tech-debt format and /kit-techdebt pipeline (unchanged from v5,
        except synth artifact split into spec.md+plan.md).
      - Multi-host architecture (opencode + claude-code, render-per-host).
